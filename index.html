<style>
:root{
  --bg:#eef1f5; --card:#ffffff; --card-head:#f3f5f9; --line:#e1e6ee;
  --text:#182233; --muted:#69758a; --accent:#ffb547; --accent-ink:#a8670a; --live:#e0432b;
  --brand:#1f5fa8; --brand-dark:#123a66;
}

/* thème sombre : réglé dans Réglages (auto = suit le téléphone) */
:root[data-theme=dark]{ color-scheme:dark; --bg:#0d131c; --card:#171f2c; --card-head:#1e2838; --line:#2a3647; --text:#e8edf5; --muted:#93a0b5; --accent-ink:#ffb547; }
:root[data-theme=dark] .date{ background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.5); }
:root[data-theme=dark] .date.active{ background:var(--brand); color:#fff; }
:root[data-theme=dark] .search input{ background:rgba(23,31,44,.96); border-color:rgba(255,255,255,.15); }
:root[data-theme=dark] .netbar{ background:#3a2f12; color:#ffd98a; border-top-color:#54441a; }
:root[data-theme=dark] .sw i{ background:#3a465a; }
:root[data-theme=dark] .score{ background:#0a0f16; }
:root[data-theme=dark] .rt.on{ box-shadow:0 0 0 1.5px var(--card); }
:root[data-theme=dark] .ptr svg{ color:#8fb8ee; }
:root[data-theme=dark] .tag-inj, :root[data-theme=dark] .tx small.out{ color:#ff7b7f; }
:root[data-theme=dark] input, :root[data-theme=dark] select, :root[data-theme=dark] textarea{ color-scheme:dark; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden]{ display:none !important; }
html{ font-size:14px; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
html,body{ margin:0; min-height:100%; overscroll-behavior-y:none; }
body{ background:transparent; color:var(--text); font-family:'Barlow Semi Condensed',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
button{ font-family:inherit; color:inherit; }

/* zone de l'heure/batterie : bande fixe pleine de la couleur de l'en-tête (iOS la teint ainsi, sans voile gris) */
html{ background:linear-gradient(180deg,#162a43 0,#162a43 max(env(safe-area-inset-top,0px),1px),var(--bg) max(env(safe-area-inset-top,0px),1px)); background-color:var(--bg); background-repeat:no-repeat; }
body::before{ content:''; position:fixed; top:0; left:0; right:0; height:env(safe-area-inset-top,0px); background:#162a43; z-index:99999; pointer-events:none; }
/* en-tête */
header{ position:sticky; top:0; z-index:10; background:linear-gradient(180deg,#162a43 0,rgba(22,42,67,.9) 18%,rgba(12,30,52,.55) 70%,rgba(8,26,48,.62) 100%),#0f2a45 url(bg-header.jpg) center/cover no-repeat; color:#fff; padding-top:env(safe-area-inset-top,0px); box-shadow:0 2px 10px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,181,71,.55); }
.top{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px 6px 16px; }
.brand{ display:flex; align-items:center; gap:9px; font-family:'Barlow Condensed',sans-serif; font-size:1.6rem; font-weight:600; letter-spacing:.02em; }
.brand img{ width:26px; height:26px; margin:4px 0 4px 4px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
.brand svg{ width:34px; height:34px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
.icon-btn svg{ filter:drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
.right{ display:flex; align-items:center; gap:0; }
.icon-btn{ width:42px; height:42px; border:none; background:none; color:inherit; display:flex; align-items:center; justify-content:center; position:relative; cursor:pointer; padding:0; }
.icon-btn svg{ width:25px; height:25px; }
#dchat.on{ color:var(--accent); }
#dchat svg{ width:23px; height:23px; }
.cal input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }
.search{ padding:2px 14px 8px; }
.search input{ width:100%; border:1px solid rgba(255,255,255,.25); border-radius:12px; background:rgba(255,255,255,.94); color:var(--text); padding:10px 12px; font-size:1rem; font-family:inherit; outline:none; }
.dates{ display:flex; gap:8px; overflow-x:auto; padding:2px 14px 12px; scrollbar-width:none; }
.dates::-webkit-scrollbar{ display:none; }
.date{
  flex-shrink:0; border:none; background:#fff; box-shadow:0 1px 3px rgba(10,20,40,.18); padding:7px 14px; border-radius:12px;
  font-family:'Barlow Condensed',sans-serif; font-size:1.05rem; font-weight:500; letter-spacing:.03em;
  color:var(--text); cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px;
}
.date.active{ background:var(--brand-dark); color:#fff; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.3); }
.icon-btn#liveBtn.has{ color:#ff6b5e; }
.icon-btn#liveBtn.on{ color:#ff6b5e; }
.icon-btn#liveBtn.on::after{ content:''; position:absolute; left:10px; right:10px; bottom:3px; height:2px; border-radius:2px; background:#ff6b5e; }
.icon-btn#liveBtn[data-n]:not([data-n=''])::before{ content:attr(data-n); position:absolute; top:3px; right:1px; min-width:15px; height:15px; padding:0 3px; box-sizing:border-box; border-radius:8px; background:#e5231b; color:#fff; font:700 .62rem/15px system-ui; text-align:center; }
.dot{ width:7px; height:7px; border-radius:50%; background:var(--live); animation:pulse 1.4s infinite; }
@keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.25 } }
.filterbar{ display:flex; align-items:center; gap:8px; padding:12px 14px 0; font-size:.95rem; color:var(--muted); }
.chip{ background:var(--card-head); border:1px solid var(--line); border-radius:999px; padding:4px 10px 4px 12px; color:var(--text); display:inline-flex; gap:8px; align-items:center; cursor:pointer; }

/* liste */
main{ padding:14px 10px 110px; max-width:640px; margin:0 auto; }
.group{ background:var(--card); border:1px solid var(--line); border-radius:18px; margin-bottom:14px; overflow:hidden; box-shadow:0 1px 3px rgba(20,30,50,.05); }
.lg{ display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--card-head); border-left:4px solid var(--accent); }
.lg img{ width:26px; height:18px; object-fit:cover; border-radius:3px; }
.lgn{ font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:1.1rem; letter-spacing:.05em; text-transform:uppercase; }
.lgc{ color:var(--muted); font-size:.9rem; text-transform:none; font-weight:400; letter-spacing:0; font-family:'Barlow Semi Condensed',sans-serif; }
.match{ display:grid; grid-template-columns:1fr auto 78px auto 1fr; align-items:center; gap:9px; padding:12px 12px; border-top:1px solid var(--line); }
.lg + .match{ border-top:none; }
.tn{ font-size:1.08rem; font-weight:500; line-height:1.15; overflow-wrap:anywhere; }
.tn.h{ text-align:right; }
.tn.a{ text-align:left; }
.crest{ width:34px; height:34px; border-radius:50%; background:var(--c,#555); position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; color:#fff; box-shadow:0 0 0 1px var(--line); }
.crest img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#fff; border-radius:50%; padding:5px; }
.mid{ text-align:center; }
.score{ display:inline-block; font-family:'Barlow Condensed',sans-serif; font-size:1.7rem; font-weight:600; line-height:1; padding:5px 14px; border-radius:10px; background:#1a2233; color:#fff; white-space:nowrap; }
.score.muted{ background:none; color:var(--muted); font-weight:400; padding:5px 0; }
.score.live{ color:#ff9d90; background:#3a1416; }
.score.strike{ text-decoration:line-through; color:var(--muted); }
.sub{ font-size:.8rem; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-top:4px; font-weight:500; }
.sub.live{ color:var(--live); font-weight:600; }
.empty{ text-align:center; color:var(--muted); padding:60px 24px; font-size:1.05rem; line-height:1.5; }
.empty small{ display:block; margin-top:8px; font-size:.85rem; opacity:.85; word-break:break-word; }
.retry{ margin-top:16px; border:1px solid var(--line); background:var(--card-head); color:var(--text); padding:9px 18px; border-radius:12px; font-size:1rem; cursor:pointer; }
.news{ display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px; margin-bottom:10px; text-decoration:none; color:var(--text); box-shadow:0 1px 3px rgba(20,30,50,.05); }
.news img{ width:96px; height:72px; object-fit:cover; border-radius:10px; flex:none; background:var(--card-head); }
.news .nt{ font-weight:600; font-size:.98rem; line-height:1.3; }
.news .nm{ color:var(--muted); font-size:.78rem; margin-top:6px; }
.ver{ text-align:center; color:var(--muted); font-size:.75rem; margin-top:8px; }

/* tiroir */
.scrim{ position:fixed; inset:0; background:rgba(10,15,25,.5); opacity:0; pointer-events:none; transition:opacity .2s; z-index:30; }
.scrim.open{ opacity:1; pointer-events:auto; }
.drawer{ position:fixed; top:0; bottom:calc(-1 * var(--vgap,0px)); right:0; width:80%; max-width:320px; background:var(--card); border-left:1px solid var(--line); z-index:31; transform:translateX(100%); visibility:hidden; transition:transform .25s, visibility .25s; padding:calc(20px + env(safe-area-inset-top,0px)) 8px 20px; overflow-y:auto; box-shadow:-4px 0 16px rgba(10,20,40,.12); }
.drawer.open{ transform:none; visibility:visible; }
.drawer h2{ margin:4px 14px 12px; font-family:'Barlow Condensed',sans-serif; font-size:1.5rem; }
.drawer h3{ margin:18px 14px 6px; font-size:.82rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-ink); font-weight:600; }
.d-item{ padding:13px 14px; border-radius:12px; font-size:1.1rem; cursor:pointer; display:flex; justify-content:space-between; }
.d-item:active{ background:var(--card-head); }
.d-item.sel{ background:var(--card-head); font-weight:600; }
.d-item.soon{ color:var(--muted); cursor:default; }

/* barre du bas */
.bottom-nav{ position:fixed; left:0; right:0; bottom:calc(-1 * var(--vgap,0px)); z-index:20; background:var(--card); display:flex; padding-bottom:env(safe-area-inset-bottom,0px); border-top:1px solid var(--line); box-shadow:0 -1px 6px rgba(20,30,50,.06); }
.nav-item{ flex:1; position:relative; border:none; background:none; padding:10px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); cursor:pointer; }
.nav-item svg{ width:25px; height:25px; }
.nav-item span{ font-size:.8rem; }
.nav-item.active{ color:var(--accent-ink); }
.nav-item.active::before{ content:''; position:absolute; top:0; width:30px; height:3px; background:var(--accent); border-radius:0 0 4px 4px; }

/* détail d'un match */
.match{ cursor:pointer; }
.match:active{ background:rgba(10,20,40,.035); }
.detail{ position:fixed; inset:0; bottom:calc(-1 * var(--vgap,0px)); z-index:40; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:50px; animation:slideIn .22s ease; }
@keyframes slideIn{ from{ transform:translateX(28px); opacity:0 } to{ transform:none; opacity:1 } }
.dh{ position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:4px; padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px 6px; background:linear-gradient(180deg,#162a43 0,rgba(22,42,67,.9) 40%,rgba(12,30,52,.6) 100%),#0f2a45 url(bg-header.jpg) center/cover no-repeat; color:#fff; }
.dh .ttl{ flex:1; min-width:0; }
.dh .ttl b{ display:block; font-family:'Barlow Condensed',sans-serif; font-size:1.2rem; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dh .ttl small{ color:rgba(255,255,255,.78); font-size:.9rem; }
.hero{ background:linear-gradient(180deg,rgba(12,30,52,.6),rgba(8,26,48,.72)),#0f2a45 url(bg-header.jpg) center/cover no-repeat; color:#fff; padding-bottom:6px; box-shadow:0 2px 10px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,181,71,.55); margin-bottom:10px; }
.hero .sbmid .score.muted{ color:rgba(255,255,255,.88); background:rgba(255,255,255,.1); }
.hero .meta{ color:rgba(255,255,255,.72); }
.hero .sbmid .score{ box-shadow:0 0 0 1px rgba(255,255,255,.22),0 3px 10px rgba(0,0,0,.4); }
.hero .sbmid .sub, .hero .sbmid .cdown{ color:rgba(255,255,255,.8); }
.hero .follow{ background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.3); color:#fff; }
.hero .follow.on{ background:var(--accent); color:#1b1305; border-color:var(--accent); }
.sb{ display:grid; grid-template-columns:1fr auto 1fr; gap:6px; align-items:start; padding:22px 12px 8px; max-width:640px; margin:0 auto; }
.sbteam{ display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; font-size:1.15rem; font-weight:500; line-height:1.15; }
.crest.cl{ background:none; box-shadow:none; overflow:visible; }
.crest.cl img{ background:none; border-radius:0; padding:0; filter:drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
.crest.big{ width:60px; height:60px; font-size:1rem; }
.sbmid{ text-align:center; padding-top:8px; min-width:108px; }
.sbmid .score{ font-size:2.5rem; padding:5px 16px; }
.sbmid .score.muted{ font-size:2.2rem; }
.sbmid .sub{ margin-top:9px; }
.meta{ text-align:center; color:var(--muted); font-size:.92rem; padding:6px 18px 14px; line-height:1.5; }
.dtabs{ display:flex; gap:8px; padding:4px 12px 14px; max-width:640px; margin:0 auto; }
.dtab{ flex:1; border:none; background:var(--card); box-shadow:0 1px 2px rgba(20,30,50,.08); padding:9px 0; border-radius:999px; font-family:'Barlow Condensed',sans-serif; font-size:1.08rem; letter-spacing:.05em; text-transform:uppercase; color:var(--text); cursor:pointer; }
.dtab.active{ background:var(--accent); color:#1b1305; font-weight:600; box-shadow:none; }
.ptr{ position:fixed; left:0; right:0; top:0; z-index:60; display:flex; justify-content:center; pointer-events:none; transform:translateY(-160px); opacity:0; visibility:hidden; }
.ptr span{ margin-top:calc(env(safe-area-inset-top) + 8px); background:var(--card); color:var(--text); border:1px solid var(--line); box-shadow:0 2px 8px rgba(20,30,50,.15); border-radius:50%; width:42px; height:42px; padding:0; display:flex; align-items:center; justify-content:center; }
.ptr svg{ width:24px; height:24px; color:var(--brand,#1f5fa8); }
.ptr.spin svg{ animation:ptrspin .8s linear infinite; }
@keyframes ptrspin{ to{ transform:rotate(360deg); } }
html{ -webkit-text-size-adjust:100%; } .detail{ overflow-x:hidden; }
.pred{ grid-column:1 / -1; margin-top:2px; }
.pbar{ display:flex; height:5px; border-radius:3px; overflow:hidden; gap:2px; background:transparent; }
.pbar i{ display:block; min-width:3px; border-radius:3px; } .pbar .h{ background:var(--accent); } .pbar .d{ background:#b9c2d0; } .pbar .a{ background:#4f7cff; }
.pnums{ display:flex; justify-content:space-between; font-size:.74rem; color:var(--muted); margin-top:3px; font-variant-numeric:tabular-nums; }
.pnums b{ color:var(--text); font-weight:600; }
.pcard{ padding:14px 14px 12px; } .pcard h4{ margin:0 0 10px; font-size:.8rem; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
.pcard .pbar{ height:10px; border-radius:6px; } .pcard .pnums{ font-size:.92rem; margin-top:8px; } .pcard .pnums b{ font-size:1.25rem; display:block; }
.pcard .pnums div:nth-child(2){ text-align:center; } .pcard .pnums div:nth-child(3){ text-align:right; }
.oddsrow{ display:flex; justify-content:space-between; gap:8px; margin:2px 0 4px; }
.oddsrow div{ flex:1; background:var(--card-head); border-radius:10px; padding:8px 6px; text-align:center; min-width:0; }
.oddsrow b{ display:block; font-size:1.25rem; font-weight:600; color:var(--accent-ink); font-variant-numeric:tabular-nums; }
.oddsrow small{ display:block; font-size:.72rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.oddsnote{ display:block; margin:0 0 10px; color:var(--muted); font-size:.72rem; }
.pcard small.pnote{ display:block; margin-top:8px; color:var(--muted); font-size:.72rem; }
.langsel{ border:1px solid var(--line); background:var(--card-head); color:var(--text); border-radius:10px; padding:8px 10px; font-size:1rem; font-family:inherit; max-width:46%; }
[dir=rtl] .chev{ display:inline-block; transform:scaleX(-1); }
[dir=rtl] .dh .icon-btn svg{ transform:scaleX(-1); }
[dir=rtl] .match, [dir=rtl] .sb, [dir=rtl] .tr, [dir=rtl] .pitch, [dir=rtl] .dtabs, [dir=rtl] .dates, [dir=rtl] .bottom-nav, [dir=rtl] .h2bar, [dir=rtl] .h2nums, [dir=rtl] .h2row, [dir=rtl] .lucol{ direction:ltr; }
[dir=rtl] .tm, [dir=rtl] .h2row .tm, [dir=rtl] .cname, [dir=rtl] .rl{ unicode-bidi:plaintext; }
.h2h{ padding:14px 14px 12px; }
.h2h h4{ margin:0 0 10px; font-size:.8rem; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
.h2bar{ display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--card-head); }
.h2bar i{ display:block; } .h2bar .a{ background:var(--accent); } .h2bar .d{ background:#b9c2d0; } .h2bar .b{ background:#4f7cff; }
.h2nums{ display:flex; justify-content:space-between; margin-top:8px; font-size:.92rem; }
.h2nums b{ font-size:1.25rem; } .h2nums small{ display:block; color:var(--muted); font-size:.72rem; }
.h2nums div:nth-child(2){ text-align:center; } .h2nums div:nth-child(3){ text-align:right; }
.probabs{ margin:0 16px 10px; padding:10px 14px; background:rgba(255,181,71,.12); border-radius:12px; font-size:.84rem; line-height:1.5; } .probabs b{ color:var(--accent-ink); }
.rt{ font-style:normal; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:.78rem; line-height:1; padding:2px 5px; border-radius:6px; color:#10202f; margin-left:auto; }
.rt.on{ position:absolute; top:-5px; left:-9px; margin:0; box-shadow:0 0 0 1.5px #fff; }
.rt.rb{ background:#4da3ff; } .rt.rg{ background:#35d08a; } .rt.ro{ background:#f5c242; } .rt.rr{ background:#ff6b6f; }
.ratenote{ margin:2px 16px 18px; color:var(--muted); font-size:.78rem; text-align:center; line-height:1.4; }
.varcard{ margin-bottom:14px; }
.varrow{ display:flex; align-items:center; gap:10px; padding:10px 16px; border-top:1px solid var(--line); }
.vmin{ width:34px; color:var(--muted); font-size:.85rem; }
.vtag{ font-size:.7rem; font-weight:700; letter-spacing:.06em; padding:3px 7px; border-radius:6px; background:#8f9ab3; color:#fff; }

.netbar{ background:#fff3d9; color:#8a5a00; font-size:.86rem; padding:6px 14px; text-align:center; border-top:1px solid #f0d9a0; }

/* équipe et joueur */
.pface{ width:44px; height:44px; border-radius:50%; background:var(--card-head); overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; color:var(--muted); box-shadow:0 0 0 1px var(--line); }
.pface img{ width:100%; height:100%; object-fit:cover; }
.pface.big{ width:96px; height:96px; font-size:1.7rem; margin:0 auto; }
.postitle{ padding:11px 14px 4px; font-family:'Barlow Condensed',sans-serif; color:var(--accent-ink); letter-spacing:.06em; text-transform:uppercase; font-size:1.05rem; }
.prow2{ display:flex; align-items:center; gap:12px; padding:10px 14px; border-top:1px solid var(--line); cursor:pointer; }
.prow2:first-of-type{ border-top:none; }
.postitle + .prow2{ border-top:none; }
.prow2:active{ background:rgba(10,20,40,.035); }
.pgroup + .pgroup .prow2:first-child{ border-top:1px solid var(--line); }
.prow2 .pinfo{ flex:1; min-width:0; }
.prow2 .pnum{ flex:0 0 26px; font-family:'Barlow Condensed',sans-serif; font-weight:600; color:var(--muted); text-align:center; }
.prow2 .pinfo b{ display:block; font-weight:500; line-height:1.15; overflow-wrap:anywhere; }
.prow2 .pinfo small{ display:block; color:var(--muted); font-size:.82rem; margin-top:1px; }
.tag-cap{ display:inline-block; margin-left:6px; background:var(--accent); color:#1b1305; font-size:.7rem; font-weight:700; border-radius:4px; padding:0 4px; vertical-align:1px; }
.tag-inj{ display:inline-block; margin-left:6px; color:#d8434a; font-size:.78rem; }
.hist{ margin:14px 12px 4px; }
.hist h4{ margin:0; padding:14px 16px 6px; font-family:'Barlow Condensed',sans-serif; font-size:1.15rem; letter-spacing:.05em; text-transform:uppercase; color:var(--accent-ink); }
.hist .facts{ display:grid; grid-template-columns:auto 1fr; gap:6px 14px; padding:4px 16px 10px; font-size:.95rem; }
.hist .facts span:nth-child(odd){ color:var(--muted); }
.hist .txt{ padding:2px 16px 8px; font-size:.95rem; line-height:1.5; white-space:pre-line; }
.hist .txt.clamp{ padding-bottom:0; margin-bottom:8px; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
.hist .more{ display:block; width:100%; border:none; background:none; color:var(--accent-ink); font:inherit; font-weight:600; padding:6px 16px 14px; text-align:left; cursor:pointer; }
.hist .none{ padding:4px 16px 16px; color:var(--muted); font-size:.92rem; }
.tl{ list-style:none; margin:0; padding:2px 16px 14px 16px; }
.tl li{ position:relative; padding:0 0 12px 22px; }
.tl li::before{ content:''; position:absolute; left:4px; top:6px; width:9px; height:9px; border-radius:50%; background:var(--accent); }
.tl li::after{ content:''; position:absolute; left:8px; top:16px; bottom:-2px; width:1px; background:var(--line); }
.tl li:last-child::after{ display:none; }
.tl li b{ display:block; font-weight:500; }
.tl li small{ color:var(--muted); }
.pprofile{ text-align:center; padding:24px 18px 6px; }
.pprofile h3{ margin:12px 0 2px; font-family:'Barlow Condensed',sans-serif; font-size:1.5rem; font-weight:600; }
.pprofile .ppos{ color:var(--accent-ink); font-size:.95rem; }
.pmeta{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px 18px; padding:14px 18px 0; color:var(--muted); font-size:.92rem; }
.fchip-tap{ display:inline-flex; align-items:center; gap:8px; cursor:pointer; }

.thero{ display:flex; align-items:center; gap:16px; text-align:left; padding:6px 18px 16px; margin-bottom:0; }
.thero .crest{ width:76px; height:76px; font-size:1.6rem; }
.thero .thr{ min-width:0; flex:1; }
.thero b{ display:block; font-family:'Barlow Condensed',sans-serif; font-size:1.7rem; line-height:1.05; letter-spacing:.03em; text-transform:uppercase; }
.thero small{ display:block; color:rgba(255,255,255,.72); font-size:.9rem; margin-top:2px; }
.thero .chips{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:10px; }
.thero .rk{ background:rgba(255,181,71,.18); color:#ffcf85; border:1px solid rgba(255,181,71,.45); border-radius:999px; padding:3px 11px; font-size:.85rem; }
.thero .rk b{ display:inline; font-size:1.05rem; letter-spacing:0; }
.fm{ display:inline-flex; gap:4px; }
.fm i{ font-style:normal; width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:.74rem; font-weight:700; color:#10202f; }
.fm i.w,.rs.w{ background:#35d08a; } .fm i.d,.rs.d{ background:#f5c242; } .fm i.l,.rs.l{ background:#ff6b6f; }
.ttabs{ display:flex; position:sticky; top:0; z-index:1; background:var(--card); border-bottom:1px solid var(--line); padding:0 6px; }
.ttabs button{ flex:1; border:none; background:none; padding:13px 0 11px; font-family:'Barlow Condensed',sans-serif; font-size:1.05rem; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); border-bottom:3px solid transparent; cursor:pointer; }
.ttabs button.active{ color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
.tk{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px 2px; font-family:'Barlow Condensed',sans-serif; font-size:1.05rem; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-ink); }
.tk span{ font-size:.85rem; color:var(--muted); letter-spacing:.03em; }
.tk .rs{ width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:.74rem; font-weight:700; color:#10202f; }
.tnext{ border-left:4px solid var(--accent); }
.tmini .more{ display:block; width:100%; padding:12px 0; border:none; border-top:1px solid var(--line); background:none; color:var(--accent-ink); font-weight:600; }
.tsec{ margin:0 0 14px; } .cplist .hist{ margin:0 0 14px; }
.tsec h4{ margin:0; padding:14px 16px 4px; font-family:'Barlow Condensed',sans-serif; font-size:1.15rem; letter-spacing:.05em; text-transform:uppercase; color:var(--accent-ink); }
.tcomp{ padding:0 16px 4px; font-size:.85rem; color:var(--muted); text-align:center; }
.tcomp2{ padding:8px 12px 0; font-size:.78rem; color:var(--muted); text-align:center; }
.form{ display:flex; gap:6px; padding:8px 10px 14px; }
.fb{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 2px 8px; border-top:4px solid var(--muted); background:rgba(127,127,127,.08); cursor:pointer; }
.fb.w{ border-color:#2ec27e; } .fb.d{ border-color:#f5c242; } .fb.l{ border-color:#ff5a5f; }
.fb b{ font-family:'Barlow Condensed',sans-serif; font-size:1.2rem; }
.fb small{ color:var(--muted); font-size:.72rem; }
</style>
</head>

<script src="i18n.js"></script>
<script>
const BACKEND = 'https://coup-denvoi-backend.onrender.com';
const VERSION = 'v121';
(function(){
  // iOS standalone : la hauteur de fenêtre peut être plus courte que l'écran -> la barre du bas flotte
  const nav = document.getElementById('bottomNav');
  function fix(){ document.documentElement.style.setProperty('--vgap', '0px'); }
  fix();
  addEventListener('resize', fix);
  addEventListener('orientationchange', () => setTimeout(fix, 300));
  addEventListener('pageshow', () => setTimeout(fix, 100));
  document.addEventListener('visibilitychange', () => setTimeout(fix, 200));
})();

const JOURS = ['DIM.','LUN.','MAR.','MER.','JEU.','VEN.','SAM.'];
const MOIS = ['JANV.','FÉVR.','MARS','AVR.','MAI','JUIN','JUIL.','AOÛT','SEPT.','OCT.','NOV.','DÉC.'];

const $ = id => document.getElementById(id);
const Z = { top: 40 };
const bringToFront = el => { el.style.zIndex = String(++Z.top); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- réglages et profil (enregistrés sur l'appareil) ---------- */
const SETTINGS = { size:'small', fr:true, auto:true, logos:true, theme:'auto' };
const PROFILE = { name:'' };
let HAD_SETTINGS = false;
try { HAD_SETTINGS = !!localStorage.getItem('ce_settings'); Object.assign(SETTINGS, JSON.parse(localStorage.getItem('ce_settings') || '{}')); } catch(e) {}
if (!SETTINGS.sizeV2){ SETTINGS.size = 'small'; SETTINGS.sizeV2 = true; try { localStorage.setItem('ce_settings', JSON.stringify(SETTINGS)); } catch(e) {} }   // nouvelle taille par défaut : Petit
if (!SETTINGS.lang) SETTINGS.lang = HAD_SETTINGS ? 'fr' : I18N.detect();
I18N.setLang(SETTINGS.lang);
try { Object.assign(PROFILE, JSON.parse(localStorage.getItem('ce_profile') || '{}')); } catch(e) {}
const saveSettings = () => { try { localStorage.setItem('ce_settings', JSON.stringify(SETTINGS)); } catch(e) {} };
const saveProfile = () => { try { localStorage.setItem('ce_profile', JSON.stringify(PROFILE)); } catch(e) {} };
const SIZES = { small:'12.5px', normal:'14px', large:'16px' };
function applySize(){ document.documentElement.style.fontSize = SIZES[SETTINGS.size] || SIZES.normal; }
applySize();
const darkMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme(){
  const dark = SETTINGS.theme === 'dark' || (SETTINGS.theme !== 'light' && darkMQ && darkMQ.matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
}
applyTheme();
if (darkMQ && darkMQ.addEventListener) darkMQ.addEventListener('change', () => { if (SETTINGS.theme === 'auto') applyTheme(); });

/* ---------- favoris (enregistrés sur l'appareil) ---------- */
const FAV = { teams:[], matches:[] };
try { Object.assign(FAV, JSON.parse(localStorage.getItem('ce_favs') || '{}')); } catch(e) {}
if (!Array.isArray(FAV.teams)) FAV.teams = [];
if (!Array.isArray(FAV.matches)) FAV.matches = [];
FAV.matches.forEach(m => { if (typeof m.ts === 'number'){ const d = new Date(m.ts); m.pdate = m.pdate || m.date; m.date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; m.time = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; } });
const FAVSTATE = { games:null, loading:false, err:null, dirty:true, ts:0, failed:0 };
const saveFav = () => { FAVSTATE.dirty = true; if (window.pushSyncSoon) pushSyncSoon(); try { localStorage.setItem('ce_favs', JSON.stringify(FAV)); } catch(e) {} };

/* ---------- notifications (buts, coup d'envoi, fin de match de tes favoris) ---------- */
const PUSH = {
  supported: 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window,
  standalone: (typeof navigator !== 'undefined' && navigator.standalone === true) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches),
  enabledOnServer: null, timer: null
};
const b64ToU8 = b => { const p = '='.repeat((4 - b.length % 4) % 4), r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
async function pushGetSub(){ const reg = await navigator.serviceWorker.ready; return reg.pushManager.getSubscription(); }
async function pushServerKey(){
  const r = await fetch(`${BACKEND}/api/push/key`); const d = await r.json();
  PUSH.enabledOnServer = !!d.enabled; return d.enabled ? d.key : null;
}
async function pushSync(){
  try {
    if (!SETTINGS.push || !PUSH.supported || Notification.permission !== 'granted') return;
    const sub = await pushGetSub(); if (!sub) return;
    await fetch(`${BACKEND}/api/push/sync`, { method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ subscription: sub.toJSON(), teams: FAV.teams.map(t => t.id), matches: FAV.matches.map(m => m.id), lang: I18N.lang }) });
  } catch(e) {}
}
window.pushSyncSoon = () => { clearTimeout(PUSH.timer); PUSH.timer = setTimeout(pushSync, 1500); };
async function pushEnable(){
  const perm = await Notification.requestPermission();           // doit venir directement du toucher
  if (perm !== 'granted') throw new Error('denied');
  const key = await pushServerKey();
  if (!key) throw new Error('server');
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64ToU8(key) });
  SETTINGS.push = true; saveSettings();
  await pushSync();
// l'app ouverte re-synchronise régulièrement : si le serveur a redémarré, il retrouve tout de suite tes favoris
setInterval(() => { if (!document.hidden) pushSync(); }, 4 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pushSync(); });
}
async function pushDisable(){
  SETTINGS.push = false; saveSettings();
  try { const sub = await pushGetSub(); if (sub){ fetch(`${BACKEND}/api/push/unsubscribe`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint }) }).catch(() => {}); await sub.unsubscribe(); } } catch(e) {}
}
async function pushTest(){
  const sub = await pushGetSub(); if (!sub) throw new Error('nosub');
  const r = await fetch(`${BACKEND}/api/push/test`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint }) });
  if (!r.ok) throw new Error('fail');
}
function pushRow(){
  let hint = 'Buts, coups d\'envoi et fins de match de tes favoris';
  let dis = '';
  if (!PUSH.supported){ hint = PUSH.standalone ? 'Ton téléphone ne gère pas les notifications pour cette app.' : 'Ajoute d\'abord l\'app à l\'écran d\'accueil (Partager, puis « Sur l\'écran d\'accueil »).'; dis = 'disabled'; }
  else if (Notification.permission === 'denied'){ hint = 'Bloquées : autorise-les dans les Réglages de ton téléphone.'; dis = 'disabled'; }
  const on = SETTINGS.push && PUSH.supported && Notification.permission === 'granted';
  return `<div class="row"><div class="rl"><b>Notifications</b><small>${hint}</small></div><label class="sw"><input type="checkbox" id="setPush" ${on ? 'checked' : ''} ${dis}><i></i></label></div>`
    + (on ? `<div class="row"><div class="rl"><b>Envoyer une notification test</b><small>Pour vérifier que tout fonctionne</small></div><button class="btn small" id="pushTest">Envoyer</button></div>` : '');
}
pushSync();

const isFavTeam = id => !!id && FAV.teams.some(t => t.id === String(id));
const isFavMatch = id => !!id && FAV.matches.some(m => m.id === String(id));
const isFavGame = g => isFavMatch(g.id) || isFavTeam(g.homeId) || isFavTeam(g.awayId);
function snap(g){
  return { id:String(g.id), date:g.date, time:g.time || '', ts:g.ts ?? null, pdate:g.pdate || g.date, home:g.home, away:g.away, homeLogo:g.homeLogo || null, awayLogo:g.awayLogo || null,
    hs:g.hs ?? null, as:g.as ?? null, status:g.status, minute:g.minute || null, comp:g.comp || '', country:g.country || '', homeId:g.homeId || '', awayId:g.awayId || '' };
}
function toggleFavMatch(g){
  const id = String(g.id), i = FAV.matches.findIndex(m => m.id === id);
  if (i >= 0) FAV.matches.splice(i, 1);
  else { FAV.matches.unshift(snap(g)); if (FAV.matches.length > 60) FAV.matches.length = 60; }
  saveFav();
}
function toggleFavTeam(id, name, logo, leagueId){
  id = String(id);
  const i = FAV.teams.findIndex(t => t.id === id);
  if (i >= 0) FAV.teams.splice(i, 1);
  else { if (FAV.teams.length >= 15) return false; FAV.teams.push({ id, name, logo: logo || null, leagueId: leagueId || null }); }
  saveFav();
  return true;
}
const starSvg = on => `<svg viewBox="0 0 24 24" fill="${on ? '#ffb547' : 'none'}" stroke="${on ? '#ffb547' : 'currentColor'}" stroke-width="1.9" stroke-linejoin="round"><path d="m12 3 2.6 5.6 6 .7-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6-4.4-4.2 6-.7L12 3Z"/></svg>`;

/* ---------- noms en français (sélections, pays, compétitions) ---------- */
const FR_COUNTRIES = {
  'Albania':'Albanie','Andorra':'Andorre','Armenia':'Arménie','Austria':'Autriche','Azerbaijan':'Azerbaïdjan','Belarus':'Biélorussie',
  'Belgium':'Belgique','Bosnia & Herzegovina':'Bosnie-Herzégovine','Bosnia and Herzegovina':'Bosnie-Herzégovine','Bosnia-Herzegovina':'Bosnie-Herzégovine',
  'Bulgaria':'Bulgarie','Croatia':'Croatie','Cyprus':'Chypre','Czech Republic':'Tchéquie','Czechia':'Tchéquie','Denmark':'Danemark','England':'Angleterre',
  'Estonia':'Estonie','Faroe Islands':'Îles Féroé','Finland':'Finlande','Georgia':'Géorgie','Germany':'Allemagne','Greece':'Grèce','Hungary':'Hongrie',
  'Iceland':'Islande','Ireland':'Irlande','Republic of Ireland':'Irlande','Israel':'Israël','Italy':'Italie','Latvia':'Lettonie','Lithuania':'Lituanie',
  'Malta':'Malte','Moldova':'Moldavie','Montenegro':'Monténégro','Netherlands':'Pays-Bas','North Macedonia':'Macédoine du Nord','Northern Ireland':'Irlande du Nord',
  'Norway':'Norvège','Poland':'Pologne','Romania':'Roumanie','Russia':'Russie','San Marino':'Saint-Marin','Scotland':'Écosse','Serbia':'Serbie',
  'Slovakia':'Slovaquie','Slovenia':'Slovénie','Spain':'Espagne','Sweden':'Suède','Switzerland':'Suisse','Turkey':'Turquie','Türkiye':'Turquie','Wales':'Pays de Galles',

function isoOf(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fromIso(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(iso, n){ const d = fromIso(iso); d.setDate(d.getDate()+n); return isoOf(d); }
const TODAY = isoOf(new Date());

/* ---------- heure locale : le serveur donne l'instant exact (ts, en ms UTC), l'appareil l'affiche dans SON fuseau ---------- */
function localize(g){
  if (!g) return g;
  if (g.pdate === undefined) g.pdate = g.date;            // date « Paris » d'origine (utile pour les demandes au serveur)
  if (typeof g.ts === 'number' && isFinite(g.ts)){
    const d = new Date(g.ts);
    g.date = isoOf(d);
    g.time = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  return g;
}
/* jours « Paris » que recouvre un jour local (ex. à New York, le 10 octobre local = les 10 et 11 à Paris) */
function parisDaysOf(iso){
  const a = fromIso(iso), b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 1, 0, 0, 0, -1);
  const fmt = new Intl.DateTimeFormat('en-US', { timeZone:'Europe/Paris', year:'numeric', month:'2-digit', day:'2-digit' });
  const key = d => { const p = {}; fmt.formatToParts(d).forEach(x => { p[x.type] = x.value; }); return `${p.year}-${p.month}-${p.day}`; };
  const first = key(a), last = key(b), out = [first];
  for (let d = first, n = 0; d !== last && n < 3; n++){ d = addDays(d, 1); out.push(d); }
  return out;
}

function dayLabel(iso){
  const diff = Math.round((fromIso(iso) - fromIso(TODAY)) / 86400000);
  if (diff === -1) return 'HIER';
  if (diff === 0) return "AUJOURD'HUI";
  if (diff === 1) return 'DEMAIN';
  const d = fromIso(iso);
  if (I18N.lang !== 'fr'){ const x = I18N.dayLabel(d); if (x) return x; }
  return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`;
}

/* ---------- connexion : copie locale pour le mode hors connexion ---------- */
const NET = { stale:false, ts:0 };
const CK = 'ce_c:';
const CACHE_MAX = 40;
function ago(ts){
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "à l'instant";
  if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `il y a ${h} h`;
  return `il y a ${Math.round(h / 24)} j`;
}
function netbar(){
  const b = $('netbar');
  const offline = typeof navigator !== 'undefined' && navigator.onLine === false;
  if (!offline && !NET.stale){ b.hidden = true; return; }
  b.textContent = (offline ? 'Hors connexion' : 'Connexion impossible') + ' · données enregistrées' + (NET.ts ? ' ' + ago(NET.ts) : '');
  b.hidden = false;
}
function cacheIndex(){ try { return JSON.parse(localStorage.getItem('ce_cidx') || '{}'); } catch(e) { return {}; } }
function cacheEvict(n){
  const idx = cacheIndex();
  Object.keys(idx).sort((a,b) => idx[a] - idx[b]).slice(0, n).forEach(k => { try { localStorage.removeItem(k); } catch(e) {} delete idx[k]; });
  try { localStorage.setItem('ce_cidx', JSON.stringify(idx)); } catch(e) {}
}
function memLoad(url){
  try { const v = JSON.parse(localStorage.getItem(CK + url)); return v && v.data ? v : null; } catch(e) { return null; }
}
function memSave(url, data){
  const key = CK + url, ts = Date.now();
  const put = () => localStorage.setItem(key, JSON.stringify({ ts, data }));
  try { put(); } catch(e) { cacheEvict(15); try { put(); } catch(e2) { return; } }
  const idx = cacheIndex();
  idx[key] = ts;
  try { localStorage.setItem('ce_cidx', JSON.stringify(idx)); } catch(e) {}
  const count = Object.keys(idx).length;
  if (count > CACHE_MAX) cacheEvict(count - CACHE_MAX);
}
const cacheCount = () => Object.keys(cacheIndex()).length;
function clearCache(){
  Object.keys(cacheIndex()).forEach(k => { try { localStorage.removeItem(k); } catch(e) {} });
  try { localStorage.removeItem('ce_cidx'); } catch(e) {}
}
// Demande au serveur ; si ça échoue (hors ligne, serveur endormi, quota), on affiche la dernière copie enregistrée.
async function apiGet(url){
  let data = {};
  try {
    const res = await fetch(url);
    try { data = await res.json(); } catch(e) {}
    if (!res.ok || data.error) throw new Error((data.detail || data.error || ('Erreur ' + res.status)).toString());
  } catch (e) {
    const c = memLoad(url);
    if (c){ NET.stale = true; NET.ts = c.ts; netbar(); return { data: c.data, stale: true, ts: c.ts }; }
    throw e;
  }
  memSave(url, data);
  NET.stale = false; netbar();
  return { data, stale: false, ts: Date.now() };
}

async function getDay(iso, force){
  const c = cache[iso];
  if (c && !force && Date.now() - c.ts < 60000) return c.games;
  const parts = await Promise.all(parisDaysOf(iso).map(d => apiGet(`${BACKEND}/api/fixtures?from=${d}&to=${d}`)));
  const seen = new Set(), all = [];
  parts.forEach(p => (p.data.games || []).forEach(g => { if (!seen.has(g.id)){ seen.add(g.id); all.push(g); } }));
  const stale = parts.some(p => p.stale);
  cache[iso] = { games: all.map(localize).filter(g => g.date === iso), ts: stale ? 0 : Date.now() };
  cache[iso].games.forEach(g => { GAME_INDEX[g.id] = g; });
  return cache[iso].games;
}
function liveCount(){
  if (NET.stale) return 0;   // données anciennes : on ne compte pas de faux « en direct »
  const c = cache[TODAY];
  return c ? c.games.filter(g => g.status === 'live').length : 0;
}

const CREST_COLORS = ['#5b3a9a','#9a2a3a','#2a5aa8','#2f7d5b','#c8742a','#2a3a7a','#8a3a7a','#2a7a7a'];
function crest(name, logo, cls=''){
  let h = 0;
  for (let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  const initials = name.split(' ').filter(w => w.length>2 || /^[A-Z]/.test(w)).slice(0,2).map(w => w[0]).join('').toUpperCase().slice(0,2) || name.slice(0,2).toUpperCase();
  // avec un logo, pas de lettres derrière (elles transparaissent) : elles n'apparaissent que si le logo manque ou ne charge pas
  const has = logo && SETTINGS.logos;
  const img = has ? `<img src="${esc(logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove('cl');this.parentNode.insertAdjacentText('afterbegin',this.dataset.i);this.remove()" data-i="${esc(initials)}">` : '';
  return `<span class="crest ${cls}${has ? ' cl' : ''}" style="--c:${CREST_COLORS[h % CREST_COLORS.length]}">${has ? '' : esc(initials)}${img}</span>`;
}

/* carton rouge à côté de l'écusson */
function redCount(g, side){
  const k = side === 'home' ? 'rcH' : 'rcA';
  if (g[k] != null && !Array.isArray(g.cards)) return g[k];
  if (Array.isArray(g.cards)) return g.cards.filter(c => c.team === side && c.card === 'red').length;
  return g[k] || 0;
}
function crestRc(g, side, cls=''){
  const name = trTeam(side === 'home' ? g.home : g.away) || '', logo = side === 'home' ? g.homeLogo : g.awayLogo;
  const n = redCount(g, side), c = crest(name, logo, cls);
  return n ? `<span class="crw">${c}<i class="rcb${cls==='big'?' big':''}">${n > 1 ? n : ''}</i></span>` : c;
}

/* minute en direct : entre deux mises à jour du serveur, on l'avance seul chaque minute */
const ANCH = {};   // id du match -> { m: minute connue, at: moment où on l'a apprise }
const estMin = (a, cap) => Math.min(cap, a.m + Math.floor((Date.now() - a.at) / 60000));
function minTag(g){
  const m = g.minute ? String(g.minute) : 'LIVE';
  if (!/^\d+$/.test(m)) { delete ANCH[g.id]; return esc(m); }
  const sv = +m, cap = sv + 4;
  const a = ANCH[g.id];
  // on garde notre propre décompte tant que le serveur n'est pas en avance sur lui : la minute avance régulièrement, sans retour en arrière
  if (!a || sv > estMin(a, 999)) ANCH[g.id] = { m: sv, at: Date.now() };
  const cur = ANCH[g.id];
  return `<span class="lmin" data-m="${cur.m}" data-at="${cur.at}" data-cap="${Math.max(cap, cur.m)}">${estMin(cur, Math.max(cap, cur.m))}'</span>`;
}
setInterval(() => {
  document.querySelectorAll('.lmin').forEach(el => {
    const t = estMin({ m: +el.dataset.m, at: +el.dataset.at }, +el.dataset.cap) + "'";
    if (el.textContent !== t) el.textContent = t;
  });
}, 5000);

function middle(g){
  const score = `${g.hs ?? 0} - ${g.as ?? 0}`;
  if (g.status === 'final') return `<div class="mid"><div class="score">${score}</div><div class="sub">Terminé</div></div>`;
  if (g.status === 'live'){
    return `<div class="mid"><div class="score live">${score}</div><div class="sub live">${minTag(g)}</div></div>`;
  }
  if (g.status === 'postponed') return `<div class="mid"><div class="score muted strike">${esc(g.time||'')}</div><div class="sub">Reporté</div></div>`;
  return `<div class="mid"><div class="score muted">${esc(g.time||'--:--')}</div></div>`;
}

function priority(g){
  const c = g.comp || '', k = g.country || '';
  if (/^caf |africa cup|african nations|qualification africa/i.test(c)) return 8;
  if (/^(uefa )?champions league/i.test(c)) return 0;
  if (/^(uefa )?(europa|conference) league/i.test(c)) return 1;
  if (/^premier league$/i.test(c) && /england/i.test(k)) return 2;
  if (/^la liga$/i.test(c)) return 3;
  if (/^ligue 1$/i.test(c)) return 4;
  if (/^bundesliga$/i.test(c) && /germany/i.test(k)) return 5;
  if (/^serie a$/i.test(c)) return 6;
  if (/nations league|world cup|euro|qualif/i.test(c)) return 7;
  return 100;
}

  if (state.sel === 'live') games = games.filter(g => g.status === 'live');

  if (q) games = games.filter(g => `${g.home} ${g.away} ${trTeam(g.home)} ${trTeam(g.away)} ${g.comp} ${trComp(g.comp)} ${g.country} ${trCountry(g.country)}`.toLowerCase().includes(q));

  if (!games.length){
    const why = state.sel === 'live' ? 'Aucun match en direct pour le moment.'
              : (lg && lg.test) ? `Aucun match de ${lg.name} ce jour-là.`
              : 'Aucun match ce jour-là.';
    main.innerHTML = `<div class="empty">${why}</div><div class="ver">Coup d'Envoi · ${VERSION}</div>`;
    return;
  }

  const groups = {};
  games.forEach(g => {
    const key = `${g.country}|${g.comp}`;
    (groups[key] = groups[key] || { comp:g.comp, country:g.country, flag:g.countryLogo, p:priority(g), items:[] }).items.push(g);
  });
  const ordered = Object.values(groups).sort((a,b) => a.p - b.p || (a.country||'').localeCompare(b.country||'') || (a.comp||'').localeCompare(b.comp||''));

  patchMain(ordered.map(gr => {
    const rows = gr.items.sort((a,b) => (a.time||'').localeCompare(b.time||'')).map(matchRow).join('');
    const flag = gr.flag ? `<img src="${esc(gr.flag)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
    return `<section class="group" data-key="${esc(gr.country + '|' + gr.comp)}"><div class="lg" data-key="lg">${flag}<span class="lgn">${esc(trComp(gr.comp))} <span class="lgc">· ${esc(trCountry(gr.country))}</span></span></div>${rows}</section>`;
  }).join('') + `<div class="ver" data-key="ver">Coup d'Envoi · ${VERSION}</div>`);
}

/* met la liste à jour SANS tout redessiner : seuls les matchs / morceaux qui ont changé sont remplacés,
   les logos des autres restent en place (plus de clignotement à l'actualisation) */
function rawOf(el){ return el.__raw !== undefined ? el.__raw : el.outerHTML; }
function tagRaw(el, depth){ el.__raw = el.outerHTML; if (depth > 0) Array.from(el.children).forEach(c => tagRaw(c, depth - 1)); }
function keyOf(el){ return el.dataset && (el.dataset.key || el.dataset.id) || el.className || el.tagName; }
function syncKeyed(oldP, newP, depth){
  const newKids = Array.from(newP.children), keep = new Set(newKids.map(keyOf));
  Array.from(oldP.children).forEach(c => { if (!keep.has(keyOf(c))) c.remove(); });
  const oldMap = new Map(); Array.from(oldP.children).forEach(c => oldMap.set(keyOf(c), c));
  let cursor = oldP.firstElementChild;
  newKids.forEach(nk => {
    const ok = oldMap.get(keyOf(nk));
    if (ok){
      if (ok === cursor) cursor = cursor.nextElementSibling; else oldP.insertBefore(ok, cursor);
      patchEl(ok, nk, depth);
    } else { tagRaw(nk, 2); oldP.insertBefore(nk, cursor); }
  });
}
function patchEl(ok, nk, depth){
  if (rawOf(ok) === nk.outerHTML) return;
  if (ok.tagName !== nk.tagName){ tagRaw(nk, 2); ok.replaceWith(nk); return; }
  Array.from(ok.attributes).forEach(a => { if (!nk.hasAttribute(a.name)) ok.removeAttribute(a.name); });
  Array.from(nk.attributes).forEach(a => { if (ok.getAttribute(a.name) !== a.value) ok.setAttribute(a.name, a.value); });
  if (ok.classList.contains('group') && depth > 0){ syncKeyed(ok, nk, depth - 1); ok.__raw = nk.outerHTML; return; }
  if (depth <= 0 || ok.children.length !== nk.children.length || !nk.children.length){ ok.innerHTML = nk.innerHTML; tagRaw(ok, 0); ok.__raw = nk.outerHTML; return; }
  Array.from(nk.children).forEach((c, i) => patchEl(ok.children[i], c, depth - 1));
  ok.__raw = nk.outerHTML;
}
function patchMain(html){
  const main = $('main');
  const tmp = document.createElement('div'); tmp.innerHTML = html;
  if (!main.querySelector('.group') || !tmp.querySelector('.group')){ main.innerHTML = html; Array.from(main.children).forEach(c => tagRaw(c, 2)); return; }
  syncKeyed(main, tmp, 3);
}

/* dernière liste connue (gardée sur l'appareil) : affichée tout de suite pendant que le serveur se réveille */
function staleDay(iso){
  const parts = parisDaysOf(iso).map(d => memLoad(`${BACKEND}/api/fixtures?from=${d}&to=${d}`));
  if (parts.some(p => !p || !p.data || Date.now() - (p.ts || 0) > 36 * 3600000)) return null;
  const seen = new Set(), all = [];
  parts.forEach(p => (p.data.games || []).forEach(g => { if (!seen.has(g.id)){ seen.add(g.id); all.push(g); } }));
  return { games: all.map(localize).filter(g => g.date === iso), ts: Math.min(...parts.map(p => p.ts || 0)) };
}
const stalebar = ts => `<div class="stalebar">Dernière mise à jour : ${esc(new Date(ts).toLocaleTimeString(I18N.locale, { hour:'2-digit', minute:'2-digit' }))} · actualisation en cours…</div>`;

async function show(){
  if (state.page !== 'matchs') return;
  const my = ++reqId;
  const iso = state.sel === 'live' ? TODAY : state.sel;
  const main = $('main');
  if (!cache[iso] || Date.now() - cache[iso].ts >= 60000){
    const old = staleDay(iso);
    if (old && old.games.length){
      old.games.forEach(g => { if (!GAME_INDEX[g.id]) GAME_INDEX[g.id] = g; });
      renderDates();
      renderGames(old.games.map(g => ({ ...g, status: g.status === 'live' ? 'scheduled' : g.status })));   // un « en direct » ancien n'est plus fiable
      main.insertAdjacentHTML('afterbegin', stalebar(old.ts));
    } else {
      main.innerHTML = `<div class="empty">Chargement des matchs…<small id="loadnote"></small></div>`;
      setTimeout(() => { const n = $('loadnote'); if (n && reqId === my) n.textContent = "Le serveur se réveille, cela peut prendre jusqu'à une minute. Les prochaines fois seront rapides."; }, 4000);
    }
  }
  let games;
  try {
    games = await getDay(iso);
  } catch (e) {
    if (my !== reqId) return;
    main.innerHTML = `<div class="empty">Impossible de charger les matchs.<small>${esc(e.message).slice(0,200)}</small><button class="retry" id="retry">Réessayer</button></div>`;
    $('retry').onclick = () => { delete cache[iso]; show(); };
    return;
  }
  if (my !== reqId) return;
  renderDates();
  renderGames(games);
}

/* glisser à gauche / à droite : la page suit le doigt, puis la suivante glisse en place (comme une vraie app) */
(function(){
  let g = null;
  const scrollableX = el => {
    for (let n = el; n && n !== document.body; n = n.parentElement){
      if (n.scrollWidth > n.clientWidth + 4){ const o = getComputedStyle(n).overflowX; if (o === 'auto' || o === 'scroll') return true; }
    }
    return false;
  };
  const after = (box, sel) => { const h = box.querySelector(sel); const out = []; for (let n = h && h.nextElementSibling; n; n = n.nextElementSibling) out.push(n); return out; };
  // contexte du geste : quels éléments bougent, y a-t-il une page avant / après, et comment changer de page
  function context(){
    if (!$('panel').hidden){
      if (PANEL.kind === 'competition' && !PANEL.sub){
        const tabs = ['matches','table'], i = tabs.indexOf(PANEL.ctab);
        return { els:() => after($('panel'), '.dtabs'), prev:i > 0, next:i >= 0 && i < tabs.length - 1,
          go:dir => { PANEL.ctab = tabs[i + dir]; $('panel').scrollTop = 0; renderPanel(); } };
      }
      return null;
    }
    if (!$('detail').hidden){
      const tabs = ['resume','compos','stats','table'], i = tabs.indexOf(DETAIL.tab);
      return { els:() => after($('detail'), '.dtabs'), prev:i > 0, next:i >= 0 && i < tabs.length - 1,
        go:dir => { DETAIL.userTab = true; DETAIL.tab = tabs[i + dir]; renderDetail(); } };
    }
    if (state.page === 'matchs'){
      const btns = [...$('dates').querySelectorAll('.date')], i = btns.findIndex(b => b.classList.contains('active'));
      return { els:() => [$('main')], prev:i > 0, next:i >= 0 && i < btns.length - 1,
        go:dir => { btns[i + dir].click(); window.scrollTo(0, 0); } };
    }
    return null;
  }
  const put = (els, x, o, anim) => els.forEach(el => {
    el.style.transition = anim ? 'transform .2s cubic-bezier(.2,.8,.2,1), opacity .2s' : 'none';
    el.style.transform = x ? `translate3d(${x}px,0,0)` : '';
    el.style.opacity = o < 1 ? String(o) : '';
  });
  const clear = els => els.forEach(el => { el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; });
  document.addEventListener('touchstart', e => {
    g = null;
    if (e.touches.length !== 1 || $('drawer').classList.contains('open') || e.target.closest('input,textarea,select,.dates,.seg') || scrollableX(e.target)) return;
    const c = context(); if (!c) return;
    const t = e.touches[0];
    g = { c, x0:t.clientX, y0:t.clientY, t0:Date.now(), axis:null, els:null, dx:0 };
  }, { passive:true });
  document.addEventListener('touchmove', e => {
    if (!g || g.axis === 'y') return;
    const t = e.touches[0], dx = t.clientX - g.x0, dy = t.clientY - g.y0;
    if (!g.axis){
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 10) return;
      if (Math.abs(dx) > Math.abs(dy) * 1.3 && g.x0 > 16){ g.axis = 'x'; g.els = g.c.els(); document.documentElement.style.overflowX = 'hidden'; }
      else { g.axis = 'y'; return; }
    }
    if (e.cancelable) e.preventDefault();
    const ok = dx < 0 ? g.c.next : g.c.prev;
    g.dx = ok ? dx : dx * 0.28;   // résistance au bord : pas de page de ce côté
    put(g.els, g.dx, 1 - Math.min(Math.abs(g.dx) / (window.innerWidth * 1.6), 0.45), false);
  }, { passive:false });
  function finish(cancel){
    const s = g; g = null;
    if (!s || s.axis !== 'x') return;
    document.documentElement.style.overflowX = '';
    const W = window.innerWidth, dx = s.dx, dt = Math.max(1, Date.now() - s.t0), v = Math.abs(dx) / dt;
    const dir = dx < 0 ? 1 : -1, ok = dir > 0 ? s.c.next : s.c.prev;
    if (cancel || !ok || (Math.abs(dx) < W * 0.28 && v < 0.5)){ put(s.els, 0, 1, true); setTimeout(() => clear(s.els), 230); return; }
    put(s.els, -dir * W, 0.2, true);          // la page actuelle sort
    setTimeout(() => {
      s.c.go(dir);                             // le nouveau contenu se met en place...
      const els = s.c.els();
      put(els, dir * W * 0.5, 0.3, false);     // ...part de l'autre côté
      requestAnimationFrame(() => requestAnimationFrame(() => { put(els, 0, 1, true); setTimeout(() => clear(els), 230); }));
    }, 190);
  }
  document.addEventListener('touchend', () => finish(false), { passive:true });
  document.addEventListener('touchcancel', () => finish(true), { passive:true });
})();

/* tirer l'écran vers le bas pour actualiser */
(function(){
  const bar = document.createElement('div'); bar.className = 'ptr'; bar.innerHTML = '<span></span>'; document.body.appendChild(bar);
  const lbl = bar.firstChild;
  let y0 = null, x0 = null, dy = 0, busy = false, scroller = null;
  const activeScroller = () => {
    if (!$('panel').hidden) return $('panel');
    if (!$('detail').hidden) return $('detail');
    return null;   // la page elle-même
  };
  const atTop = sc => (sc ? sc.scrollTop : (window.scrollY || document.documentElement.scrollTop || 0)) <= 0;
  // la liste (et seulement elle) descend sous le doigt ; l'en-tête reste en place
  const target = () => scroller === null ? $('main') : (scroller === $('detail') ? $('dbody') : scroller.querySelector('.cplist'));
  const anchorEl = () => scroller === null ? document.querySelector('header') : (scroller.querySelector('.hero') || scroller.querySelector('.dh'));
  const setBar = (px, text) => {
    const hd = anchorEl(), page = scroller === null;
    bar.style.visibility = 'visible'; bar.style.opacity = '1'; bar.style.transition = 'none';
    bar.style.zIndex = page ? '5' : String(Z.top + 1);
    bar.style.top = hd ? hd.getBoundingClientRect().bottom + 'px' : '0px';
    lbl.style.marginTop = '8px';
    const p = Math.min(px, 90);
    bar.style.transform = `translateY(${p - 50}px)`;
    bar.style.opacity = String(Math.max(0, Math.min(1, (p - 8) / 40)));
    if (!lbl.firstChild) lbl.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4a8 8 0 0 1 7.2 4.5l1.9-1.1-.4 5.2-4.5-2.8 1.7-1A5.6 5.6 0 0 0 6.9 9.3L5.2 7.7A8 8 0 0 1 12 4z"/><path d="M12 20a8 8 0 0 1-7.2-4.5l-1.9 1.1.4-5.2 4.5 2.8-1.7 1a5.6 5.6 0 0 0 9.0 1.5l1.7 1.6A8 8 0 0 1 12 20z"/></svg>';
    lbl.firstChild.style.transform = text === 'Actualisation…' ? '' : `rotate(${p * 4}deg)`;
    bar.classList.toggle('spin', text === 'Actualisation…');
    const t = target(); if (t){ applied = t; t.style.transition = 'none'; t.style.transform = `translateY(${p}px)`; }
  };
  let applied = null;
  const hideBar = () => { bar.classList.remove('spin'); if (applied){ const t = applied; applied = null; t.style.transition = 'transform .25s'; t.style.transform = ''; setTimeout(() => { if (!t.style.transform) t.style.transition = ''; }, 280); } bar.style.transition = 'transform .25s, opacity .25s'; bar.style.transform = 'translateY(-160px)'; bar.style.opacity = '0'; setTimeout(() => { if (bar.style.opacity === '0') bar.style.visibility = 'hidden'; }, 280); };
  function doRefresh(){
    if (!$('panel').hidden){ if (PANEL.kind === 'team' && PANEL.team){ delete TEAM[PANEL.team.leagueId + ':' + PANEL.team.id]; PANEL.squad = null; renderPanel(); loadSquad(); } else if (PANEL.kind === 'competition' && PANEL.comp){ openCompetition(PANEL.comp.id); } return; }
    if (!$('detail').hidden){ DETAIL.err = null; loadDetail(); return; }
    if (state.page === 'matchs'){ const iso = state.sel === 'live' ? TODAY : state.sel; getDay(iso, true).then(g => { if (state.page === 'matchs' && (state.sel === 'live' ? TODAY : state.sel) === iso){ renderDates(); renderGames(g); } }).catch(() => {}); }
    else if (state.page === 'favoris'){ FAVSTATE.dirty = true; showFavoris(); }
    else if (state.page === 'infos' || state.page === 'transferts') renderNews(state.page);
  }
  document.addEventListener('touchstart', e => {
    if (busy || e.touches.length !== 1 || $('drawer').classList.contains('open')) { y0 = null; return; }
    scroller = activeScroller();
    if (!atTop(scroller) || e.target.closest('input,textarea,select')) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0;
  }, { passive:true });
  document.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (x0 != null && Math.abs(e.touches[0].clientX - x0) > Math.abs(dy) && !applied){ y0 = null; return; }
    if (dy <= 0){ if (!atTop(scroller)) y0 = null; hideBar(); return; }
    if (!atTop(scroller)){ y0 = null; hideBar(); return; }
    const pull = dy * 0.5;
    setBar(pull, pull > 45 ? 'Relâche pour actualiser' : 'Tire pour actualiser');
  }, { passive:true });
  document.addEventListener('touchend', () => {
    if (y0 == null) return;
    const go = dy * 0.5 > 45; y0 = null; dy = 0;
    if (!go){ hideBar(); return; }
    busy = true; setBar(60, 'Actualisation…'); bar.style.transition = 'transform .2s'; bar.style.transform = 'translateY(10px)';
    try { doRefresh(); } catch(e) {}
    setTimeout(() => { hideBar(); busy = false; }, 1200);
  }, { passive:true });
})();

/* des matchs en direct, ou dont l'heure de début est passée mais qui s'affichent encore « pas commencé » */
function needsRefresh(){
  const c = cache[TODAY];
  if (!c) return false;
  const now = Date.now();
  return c.games.some(g => g.status === 'live' || (g.status === 'scheduled' && typeof g.ts === 'number' && g.ts <= now && now - g.ts < 4 * 3600000));
}

/* retour dans l'app (après une pause ou un autre écran) : nouveau jour -> on recharge ; sinon on remet les scores à jour */
document.addEventListener('visibilitychange', () => {

});

function fmtCountdown(ts){

  const m = Math.floor(t / 60), sec = t - m * 60;
  const p = n => String(n).padStart(2, '0');
  return (d ? d + ' j ' : '') + (d || h ? h + ' h ' : '') + p(m) + ' min ' + p(sec) + ' s';
}

const PARTICLES = new Set(['de','da','do','dos','das','van','von','der','den','di','del','le','la','el','al','bin','ter','ten']);
function lastName(full){
  const w = String(full || '').trim().split(/\s+/);
  if (w.length <= 1) return w[0] || '';
  const prev = w[w.length - 2].toLowerCase();
  return (w.length >= 3 && PARTICLES.has(prev)) ? w[w.length - 2] + ' ' + w[w.length - 1] : w[w.length - 1];
}
const norm = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
// "Jayden Bogle" et "J. Bogle" donnent la même clé : j|bogle
const PLAYED = new Set();   // joueurs vus dans une composition de match en cours / terminé : ils ne sont donc pas blessés
const isInj = p => !!p.injured && !PLAYED.has(pkey(p.name));
const pkey = full => { const w = String(full || '').trim().split(/\s+/); return norm((w[0] || '').charAt(0)) + '|' + norm(w[w.length - 1]); };

// Répartit les 11 titulaires en lignes selon la formation (ex. 3-5-2). Renvoie null si impossible.
function formationRows(system, players){
  const parts = String(system || '').split('-').map(Number);
  if (players.length !== 11 || parts.length < 2 || parts.some(n => !n) || parts.reduce((a,b) => a + b, 0) !== 10) return null;
  const sorted = [...players].sort((a,b) => Number(a.pos) - Number(b.pos));
  if (!sorted.every((p,i) => Number(p.pos) === i + 1)) return null;
  const rows = [[sorted[0]]];
  let i = 1;
  parts.forEach(n => { rows.push(sorted.slice(i, i + n)); i += n; });
  return rows;
}

function preloadSquadPhotos(d){

const PHSTATE = {};       // identifiant du match -> { tries, busy }
function phKey(teamName, name){ return norm(teamName) + '|' + pkey(name); }
// photo prise dans l'effectif du club (celle qu'on voit dans la liste des joueurs), quand le joueur y est reconnu
const PHBAD = {};   // photos d'effectif qui ne se chargent pas -> on passe à l'autre source
function phBad(img){
  const pn = img.closest('.pn'); if (pn) pn.classList.add('nophoto');
  const u = img.getAttribute('src'); if (!u || PHBAD[u]) return;
  PHBAD[u] = 1;
  if (DETAIL && DETAIL.data){ const st = PHSTATE[DETAIL.data.id]; if (st){ st.done = false; st.tries = Math.min(st.tries, 15); st.nextAt = 0; } loadLineupPhotos(DETAIL.data); }
}
function squadPhoto(d, side, name, num){
  const teamId = side === 'home' ? d.homeId : d.awayId;
  const c = teamId && d.leagueId && TEAM[teamKey(d.leagueId, teamId)];
  const list = c && c.data && c.data.players && c.data.players.filter(x => x.photo && !PHBAD[x.photo]);
  if (!list || !name) return '';
  const words = s => norm(String(s || '')).split(/[^a-z0-9]+/).filter(w => w.length > 2);
  const k = pkey(name), last = norm(String(name).trim().split(/\s+/).pop());
  let p = list.find(x => pkey(x.name) === k || (x.fullName && pkey(x.fullName) === k));
  if (!p){
    const same = list.filter(x => [x.name, x.fullName].some(n => n && norm(String(n).trim().split(/\s+/).pop()) === last));
    if (same.length === 1) p = same[0];
  }
  if (!p && num){   // même numéro de maillot + au moins un mot du nom en commun
    const w = words(name);
    const byN = list.filter(x => String(x.number) === String(num) && [x.name, x.fullName].some(n => words(n).some(t => w.includes(t))));
    if (byN.length === 1) p = byN[0];
  }
  return p ? p.photo : '';
}
function phUrl(d, side, name, num){
  if (!SETTINGS.logos) return '';
  return PH[phKey(side === 'home' ? d.home : d.away, name)] || squadPhoto(d, side, name, num);
}
function loadLineupPhotos(d){
  if (!d || !d.lineups) return;
  const st = PHSTATE[d.id] = PHSTATE[d.id] || { tries: 0, busy: false, done: false };
  if (st.busy || st.done || st.tries >= 20 || Date.now() < (st.nextAt || 0)) return;
  // les noms complets (« Joe Willock ») viennent de l'effectif : on l'attend s'il est en cours de chargement
  st.t0 = st.t0 || Date.now();
  if (Date.now() - st.t0 < 20000 && !String(d.leagueId || '').startsWith('afr:') && [d.homeId, d.awayId].some(id => id && d.leagueId && TEAM[teamKey(d.leagueId, id) + ':loading'])) {
    setTimeout(() => { if (DETAIL.id === String(d.id).replace(/~p$/, '')) loadLineupPhotos(d._prob ? d : (DETAIL.data || d)); }, 4000);   // l'effectif tarde : on réessaie, et au bout de 20 s on cherche sans lui
    return;
  }
  st.busy = true; st.tries++;
  const sides = ['home', 'away'];
  Promise.all(sides.map(async side => {
    const teamName = side === 'home' ? d.home : d.away;
    const l = d.lineups[side] || {};
    const teamId = side === 'home' ? d.homeId : d.awayId;
    const plist = [...(l.starters || []), ...(l.subs || [])].filter(p => p.name);
    const names = plist.map(p => p.name);
    const need = plist.filter(p => !PH[phKey(teamName, p.name)] && !(PH[phKey(teamName, p.name) + '#miss']) && !squadPhoto(d, side, p.name, p.n)).map(p => p.name);
    if (!names.length) return { left: 0, paused: false, none: true };
    if (!teamName || !need.length) return { left: 0, paused: false };
    const fullOf = n => { const f = findSquadPlayer(d.leagueId, teamId, n); return f && f.fullName && f.fullName !== n ? f.fullName : ''; };
    try {
      const q = need.map(n => { const f = fullOf(n); return f ? `${n}~${f}` : n; }).join('|');
      const res = await fetch(`${BACKEND}/api/photos?team=${encodeURIComponent(teamName)}&names=${encodeURIComponent(q)}`);
      const j = await res.json();
      if (!res.ok || j.error) return { left: 1, paused: false, err: true };
      const got = j.photos || {};
      if (Object.keys(got).length) savePhotos();
      need.forEach(n => { if (got[n]) PH[phKey(teamName, n)] = got[n]; else if (!j.pending && !j.paused) PH[phKey(teamName, n) + '#miss'] = 1; });
      return { left: (j.pending || 0) + (j.paused ? 1 : 0), paused: !!j.paused };
    } catch (e) { return { left: 1, paused: false, err: true }; }   // serveur qui se réveille, réseau coupé… : on réessaie
  })).then(r => {
    st.busy = false;
    if (r.every(b => b.none)){ st.tries--; return; }   // pas encore de compositions : rien à chercher, on ne se déclare pas « terminé »
    const left = r.reduce((a, b) => a + b.left, 0);
    const paused = r.some(b => b.paused);
    if (DETAIL.id === String(d.id).replace(/~p$/, '') && (DETAIL.tab === 'compos' || DETAIL.tab === 'resume')) renderDetail();
    const wait = paused ? 20000 : (r.some(b => b.err) ? 6000 : 3000);
    if (left > 0) st.nextAt = Date.now() + wait;
    if (left > 0) setTimeout(() => { if (DETAIL.id === String(d.id).replace(/~p$/, '')) loadLineupPhotos(d._prob ? d : (DETAIL.data || d)); }, wait + 300);
    else st.done = true;
  });
}

/* ---------- note du joueur après le match (calculée par l'app) ---------- */
function rtMin(t){ const m = String(t == null ? '' : t).match(/\d+/); return m ? Number(m[0]) : null; }
function computeRatings(d){
  if (!d || d.status !== 'final' || !d.lineups) return null;
  const out = {};
  const sides = ['home', 'away'];
  const goalsFor = { home: Number(d.hs) || 0, away: Number(d.as) || 0 };
  sides.forEach(sd => {
    const l = d.lineups[sd] || {};
    const starters = l.starters || [], subs = l.subs || [];
    if (starters.length < 11) return;
    const conceded = sd === 'home' ? goalsFor.away : goalsFor.home, scored = goalsFor[sd];
    const mg = Math.abs(scored - conceded), res = scored > conceded ? 0.4 + Math.min(0.3, 0.1 * (mg - 1)) : scored < conceded ? -(0.4 + Math.min(0.3, 0.1 * (mg - 1))) : 0;
    const defN = (parseInt(String(sd === 'home' ? d.homeSystem : d.awaySystem).split('-')[0], 10)) || 4;
    const end = {}, start = {};
    starters.forEach(p => { start[pkey(p.name)] = 0; end[pkey(p.name)] = 90; });
    (d.subs || []).filter(x => x.team === sd).forEach(x => {
      const t = rtMin(x.time) ?? 60;
      if (end[pkey(x.out)] !== undefined) end[pkey(x.out)] = t;
      const k = pkey(x.in); start[k] = t; end[k] = 90;
    });
    const ev = {};
    const bump = (name, f) => { const k = pkey(name); ev[k] = ev[k] || { g:0, a:0, y:0, r:0, og:0 }; f(ev[k]); };
    (d.goals || []).filter(g => g.team === sd).forEach(g => {
      if (/own/i.test(g.info || '')) bump(g.player, e => e.og++); else { bump(g.player, e => e.g++); if (g.assist) bump(g.assist, e => e.a++); }
    });
    (d.cards || []).filter(c => c.team === sd).forEach(c => bump(c.player, e => { if (c.card === 'red') e.r++; else e.y++; }));
    [...starters, ...subs].forEach(p => {
      const k = pkey(p.name);
      if (start[k] === undefined) return;               // sur le banc, n'est pas entré
      const mins = (end[k] ?? 90) - start[k];
      if (mins < 15) return;                            // trop peu de temps de jeu : pas de note
      const e = ev[k] || { g:0, a:0, y:0, r:0, og:0 };
      const isGk = starters.some(s => pkey(s.name) === k && String(s.pos) === '1');
      const isDef = starters.some(s => pkey(s.name) === k && Number(s.pos) >= 2 && Number(s.pos) <= 1 + defN);
      let r = 6.0 + res + 0.9 * e.g + 0.6 * e.a - 0.3 * e.y - 1.6 * e.r - 1.0 * e.og;
      const share = Math.min(1, mins / 90);
      if (isGk || isDef){ r += conceded === 0 ? (isGk ? 0.9 : 0.5) * share : -Math.min(1.2, conceded * (isGk ? 0.25 : 0.2)) * share; }
      else if (!e.g && !e.a) r += 0;
      if (mins < 60) r = 6 + (r - 6) * 0.7;
      out[sd + ':' + k] = Math.max(3, Math.min(10, Math.round(r * 10) / 10));
    });
  });
  return Object.keys(out).length ? out : null;
}
function ratingCls(r){ return r >= 8 ? 'rb' : r >= 7 ? 'rg' : r >= 6 ? 'ro' : 'rr'; }
function ratingTag(R, side, name, cls){ const r = R && R[side + ':' + pkey(name)]; return r == null ? '' : `<i class="rt ${ratingCls(r)} ${cls || ''}">${r.toFixed(1)}</i>`; }

const PROB = {};   // id du match -> { loading } | { data } | { none } | { err }
function probableOf(d){
  if (!d || !d.homeId || !d.awayId || d.status === 'live' || d.status === 'final') return null;

const ZONES = {

const NO_TABLE = `<div class="noev">Pas de classement pour cette compétition.<br><small style="opacity:.8">Les coupes et les phases à élimination directe n'en ont pas, ou le fournisseur de données ne l'envoie pas.</small></div>`;

/* classement provisoire : on ajoute le score en cours des matchs « en direct » de cette compétition */
function liveRows(rows, leagueId, cur){
  const games = Object.values(GAME_INDEX).filter(g => g && String(g.leagueId) === String(leagueId) && g.status === 'live' && g.hs != null && g.as != null && (!cur || g.id !== cur.id));
  if (cur && cur.status === 'live' && cur.hs != null && cur.as != null) games.push(cur);
  // match terminé mais pas encore compté par le classement officiel (il retarde souvent de plusieurs heures) :
  // la « journée » du match dit combien de matchs chaque équipe doit avoir joués
  const rn = cur && cur.round ? parseInt((String(cur.round).match(/\d+/) || [])[0], 10) : NaN;
  const fin = [];
  if (rn > 0 && cur.date){
    const same = Object.values(GAME_INDEX).filter(g => g && g.id !== cur.id && String(g.leagueId) === String(leagueId) && g.status === 'final' && g.date === cur.date && g.hs != null && g.as != null);
    if (cur.status === 'final' && cur.hs != null && cur.as != null) same.push(cur);
    same.forEach(g => fin.push(g));
  }
  if (!games.length && !fin.length) return { rows, live:false };
  const out = rows.map(r => ({ ...r })), by = {};
  out.forEach(r => { if (r.teamId != null) by[String(r.teamId)] = r; by['n:' + norm(r.team)] = r; });
  const find = (id, name) => by[String(id)] || by['n:' + norm(name)];
  let touched = false;
  const isFin = new Set(fin);
  games.push(...fin);
  games.forEach(g => {
    const h = find(g.homeId, g.home), a = find(g.awayId, g.away);
    if (!h || !a || h === a) return;
    if (isFin.has(g) && ((h.played || 0) >= rn || (a.played || 0) >= rn)) return;
    const hs = +g.hs, as = +g.as;
    [[h, hs, as], [a, as, hs]].forEach(([r, f, ag]) => {
      r.played = (r.played || 0) + 1; r.gf = (r.gf || 0) + f; r.ga = (r.ga || 0) + ag;
      if (f > ag){ r.w = (r.w || 0) + 1; r.pts = (r.pts || 0) + 3; } else if (f === ag){ r.d = (r.d || 0) + 1; r.pts = (r.pts || 0) + 1; } else r.l = (r.l || 0) + 1;
      r.lv = true;
    });
    touched = true;
  });
  if (!touched) return { rows, live:false };
  const groups = {};
  out.forEach((r, i) => { r._i = i; (groups[r.stage || ''] = groups[r.stage || ''] || []).push(r); });
  Object.values(groups).forEach(list => {
    const old = list.slice().sort((a,b) => (a.pos ?? 999) - (b.pos ?? 999));
    const zones = old.map(r => r.zone);
    const oldPos = new Map(old.map(r => [r, r.pos]));
    list.sort((a,b) => (b.pts||0) - (a.pts||0) || ((b.gf||0)-(b.ga||0)) - ((a.gf||0)-(a.ga||0)) || (b.gf||0) - (a.gf||0) || (oldPos.get(a) ?? 999) - (oldPos.get(b) ?? 999));
    list.forEach((r, i) => { const p0 = oldPos.get(r); r.pos = i + 1; r.zone = zones[i]; r.mv = r.lv && p0 ? p0 - r.pos : 0; });
  });
  return { rows: out, live: games.some(g => !isFin.has(g)), prov:true };
}
const STANDAT = {};   // "ligue|date" -> { rows } | { loading } | { err }
function tabTableAt(d, g){

      .then(r => { STANDAT[key] = { rows:r.data.rows || [], note:r.data.note || '' }; })
      .catch(e => { STANDAT[key] = { err:e.message }; })
      .finally(() => { if (DETAIL.id === d.id && DETAIL.tab === 'table') renderDetail(); });
  }
  if (A.loading) return `<div class="card2"><div class="noev">Chargement du classement de l'époque…</div></div>`;
  if (A.err) return `<div class="card2"><div class="noev">Classement de l'époque indisponible.<br><small style="opacity:.8">${esc(A.err).slice(0,160)}</small></div></div>`;
  if (!A.rows.length) return `<div class="card2"><div class="noev">${esc(A.note || "Classement de l'époque indisponible pour ce match.")}</div></div>`;
  return `<div class="livetag" style="color:var(--muted)">Classement avant ce match · ${esc(dayLabelLong(date))}</div><div class="card2">${standingsHtml(A.rows, { ids:[d.homeId, d.awayId], names:[d.home, d.away], leagueId:d.leagueId })}</div>`;
}
function dayLabelLong(iso){ const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; }
function tabTable(d){
  if (!d.leagueId) return `<div class="card2">${NO_TABLE}</div>`;
  { const g = GAME_INDEX[d.id]; if (g && g.hist) return tabTableAt(d, g); }
  if (DETAIL.standErr) return `<div class="card2"><div class="noev">Impossible de charger le classement.<br><small style="opacity:.8">${esc(DETAIL.standErr).slice(0,200)}</small><br><button class="retry" id="sretry">Réessayer</button></div></div>`;

}

/* ---------- équipe et joueur ---------- */
const TEAM = {};   // "leagueId:teamId" -> { data, ts }
function teamKey(leagueId, teamId){ return `${leagueId}:${teamId}`; }
async function getTeam(leagueId, teamId, force){
  const key = teamKey(leagueId, teamId);
  const c = TEAM[key];
  if (c && !force && Date.now() - c.ts < 30 * 60 * 1000) return c.data;
  const res = await fetch(`${BACKEND}/api/team?league_id=${encodeURIComponent(leagueId)}&team_id=${encodeURIComponent(teamId)}`);
  let data = {};
  try { data = await res.json(); } catch(e) {}
  if (!res.ok || data.error) throw new Error((data.detail || data.error || ('Erreur ' + res.status)).toString());
  TEAM[key] = { data, ts: Date.now() };
  return data;
}
function openTeam(teamId, leagueId, name, logo){
  try {
    if (!teamId || !leagueId) {
      alert(`Diagnostic — info manquante pour ouvrir l'équipe.\n\néquipe : ${teamId || '(aucune)'}\nchampionnat : ${leagueId || '(aucun)'}\n\nEnvoie une capture de ce message à Claude.`);
      return;
    }
    PANEL.team = { id: String(teamId), leagueId: String(leagueId), name: name || '', logo: logo || null };
    PANEL.squad = null; PANEL.teamErr = null; PANEL.sub = null; PANEL.player = null;
    PANEL.tab = 'info'; PANEL.tgames = null; PANEL.tgErr = null; PANEL.tgLoading = false; PANEL.standErr = null; PANEL.clubOpen = false;
    openPanel('team');
    loadSquad();
    loadTeamGames();
  } catch (e) {
    alert('Diagnostic — erreur en ouvrant l\'équipe :\n' + (e && e.message ? e.message : e) + '\n\nEnvoie une capture de ce message à Claude.');
  }
}
function loadSquad(){
  const t = PANEL.team;
  getTeam(t.leagueId, t.id)
    .then(data => {
      if (!PANEL.team || PANEL.team.id !== t.id) return;
      PANEL.squad = data.players || [];
      if (data.name) PANEL.team.name = data.name;
      if (data.badge) PANEL.team.logo = data.badge;
    })
    .catch(e => { if (PANEL.team && PANEL.team.id === t.id) PANEL.teamErr = e.message; })
    .finally(() => renderPanel());
}

function isTeamGame(g, t){ return String(g.homeId) === t.id || String(g.awayId) === t.id || g.home === t.name || g.away === t.name; }
async function loadTeamGames(){
  const t = PANEL.team;
  if (!t || PANEL.tgLoading) return;
  PANEL.tgLoading = true;
  const afr = String(t.leagueId).startsWith('afr:');
  const url = afr ? `${BACKEND}/api/fixtures?league_id=${encodeURIComponent(t.leagueId)}&from=${addDays(TODAY, -60)}&to=${addDays(TODAY, 60)}`
                  : `${BACKEND}/api/fixtures?team_id=${encodeURIComponent(t.id)}&from=${addDays(TODAY, -70)}&to=${addDays(TODAY, 70)}`;
  try {
    const { data } = await apiGet(url);
    if (!PANEL.team || PANEL.team.id !== t.id) return;
    const gs = (data.games || []).map(localize).filter(g => isTeamGame(g, t));
    gs.sort((a, b) => (a.ts || 0) - (b.ts || 0));
    gs.forEach(g => { GAME_INDEX[g.id] = g; });
    PANEL.tgames = gs;
    // championnat « principal » = celui où l'équipe a le plus de matchs (pour le classement)
    const cnt = {}; gs.forEach(g => { if (g.leagueId) cnt[g.leagueId] = (cnt[g.leagueId] || { n: 0, name: g.comp }); if (g.leagueId) cnt[g.leagueId].n++; });
    const best = Object.keys(cnt).sort((a, b) => cnt[b].n - cnt[a].n)[0];
    PANEL.stLeague = best ? { id: String(best), name: cnt[best].name } : { id: String(t.leagueId), name: '' };
  } catch (e) { if (PANEL.team && PANEL.team.id === t.id) PANEL.tgErr = e.message; }
  PANEL.tgLoading = false;
  if (PANEL.kind === 'team') renderPanel();
}
function teamResult(g, t){
  const home = String(g.homeId) === t.id || g.home === t.name;
  const a = Number(home ? g.hs : g.as), b = Number(home ? g.as : g.hs);
  if (!isFinite(a) || !isFinite(b)) return 'd';
  return a > b ? 'w' : a < b ? 'l' : 'd';
}
function teamDate(iso){ try { return fromIso(iso).toLocaleDateString(I18N.lang, { day:'numeric', month:'short' }).toUpperCase(); } catch (e) { return iso; } }
function teamGamesState(){
  if (PANEL.tgErr) return `<div class="empty">Impossible de charger les matchs.<small>${esc(PANEL.tgErr).slice(0,200)}</small><button class="retry" id="tgretry">Réessayer</button></div>`;
  if (!PANEL.tgames){ if (!PANEL.tgLoading) loadTeamGames(); return `<div class="empty">Chargement des matchs…<small>Le serveur gratuit peut mettre un moment à répondre.</small></div>`; }
  return '';
}
function teamRankRow(){
  const L = PANEL.stLeague, S = L && STAND[L.id], t = PANEL.team;
  if (!S || !S.rows || !S.rows.length) return null;
  const rows = S.rows.slice().sort((x, y) => (x.pos ?? 999) - (y.pos ?? 999));
  const i = rows.findIndex(r => (r.teamId && String(r.teamId) === t.id) || norm(r.team) === norm(t.name));
  return i < 0 ? null : { rows, i, row: rows[i] };
}
function teamInfoHtml(){
  const t = PANEL.team, st = teamGamesState();
  let top = '';
  if (st) top = st;
  else {
    const gs = PANEL.tgames, fin = gs.filter(g => g.status === 'final');
    const last = fin[fin.length - 1], next = gs.find(g => g.status !== 'final');
    const live = next && next.status === 'live';
    if (next) top += `<div class="card2 tnext"><div class="tk">${live ? 'Match en cours' : 'À suivre'}<span>${esc(live ? '' : dayLabel(next.date))}</span></div><div class="tcomp">${esc(trComp(next.comp))} · ${esc(teamDate(next.date))}</div>${matchRow(next)}</div>`;
    if (last) top += `<div class="card2 tlast"><div class="tk">Dernier résultat<span class="rs ${teamResult(last, t)}">${{w:'V',d:'N',l:'D'}[teamResult(last, t)]}</span></div><div class="tcomp">${esc(trComp(last.comp))} · ${esc(teamDate(last.date))}</div>${matchRow(last)}</div>`;
    if (!last && !next) top = `<div class="empty">Aucun match récent ou à venir pour cette équipe.</div>`;
    // classement autour de l'équipe
    const L = PANEL.stLeague;
    if (L && !STAND[L.id] && !PANEL.standErr) loadPanelStand(L.id);
    const rk = teamRankRow();
