      const from = Math.max(0, Math.min(rk.i - 2, rk.rows.length - 5)), part = rk.rows.slice(from, from + 5);
      top += `<div class="card2 tmini"><div class="tk">Classement<span>${esc(trComp(L.name || ''))}</span></div>${standingsHtml(part, { favs:true, leagueId:L.id, ids:[t.id], names:[t.name] })}<button class="more" id="goTable">Voir le classement complet</button></div>`;

function teamPanelHtml(head){
  const t = PANEL.team, tab = PANEL.tab || 'info';

function playerIdent(p){ return p.id || pkey(p.name); }

const HIST = {};   // clé -> { loading, data, err }
function histLoad(key, url, pick){
  if (HIST[key]) return HIST[key];
  const h = HIST[key] = { loading:true, data:null, tries:(HIST['t|' + key] || 0) };
  apiGet(url).then(r => { h.data = pick(r.data) || null; h.paused = !!r.data.paused; })
    .catch(e => { h.err = e.message; })
    .finally(() => {
      h.loading = false;
      // source momentanément saturée : on réessaie toute seule (3 fois au plus)
      if ((h.paused || h.err) && h.tries < 3){
        HIST['t|' + key] = h.tries + 1;
        setTimeout(() => { if (HIST[key] === h){ delete HIST[key]; if (!$('panel').hidden) renderPanel(); } }, 12000);
      }
      if (!$('panel').hidden) renderPanel();
    });
  return h;
}

const chatRoom = id => { const k = String(id); return CHAT.rooms[k] = CHAT.rooms[k] || { msgs:[], last:0, loaded:false, err:false, reported:new Set() }; };
function toastMsg(t){

function chatHue(name){ let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function chatMsgHtml(m){

function tabChat(){

  const empty = R.loaded && !list ? `<div class="chatempty">Aucun message pour l'instant. Lance la discussion !</div>` : '';

function chatScrollBottom(force){
  const box = $('detail'); if (!box) return;
  if (force || box.scrollHeight - box.scrollTop - box.clientHeight < 160) box.scrollTop = box.scrollHeight;
}
async function chatPoll(first){
  const id = DETAIL.id; if (!id) return;
  const R = chatRoom(id);
  try {
    const res = await fetch(`${BACKEND}/api/chat/messages?room=${encodeURIComponent(id)}&since=${R.last}`);
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || 'erreur');
    const wasEmpty = !R.loaded;
    R.loaded = true; R.err = false;
    (j.gone || []).forEach(g => { R.msgs = R.msgs.filter(m => m.id !== g); const el = document.querySelector(`.cmsg[data-id="${g}"]`); if (el) el.remove(); });
    const fresh = (j.messages || []).filter(m => !R.msgs.some(x => x.id === m.id));
    fresh.forEach(m => { R.msgs.push(m); R.last = Math.max(R.last, m.id); });
    if (DETAIL.id !== id || DETAIL.tab !== 'chat') return;
    if (wasEmpty || first){ renderDetail(); chatScrollBottom(true); }
    else if (fresh.length){
      const l = $('chatlist'); if (l){ const near = $('detail').scrollHeight - $('detail').scrollTop - $('detail').clientHeight < 160; l.querySelectorAll('.chatempty').forEach(e => e.remove()); l.insertAdjacentHTML('beforeend', fresh.filter(m => !R.reported.has(m.id)).map(chatMsgHtml).join('')); if (near) chatScrollBottom(true); }
    }
  } catch (e) {
    if (!R.loaded){ R.err = true; if (DETAIL.id === id && DETAIL.tab === 'chat') renderDetail(); }
  }
}
function chatStartPolling(){
  const R = chatRoom(DETAIL.id);
  if (!R.loaded && !R.loading){ R.loading = true; chatPoll(true).finally(() => { R.loading = false; }); }
  if (CHAT.timer) return;
  CHAT.timer = setInterval(() => {
    if (!DETAIL.id || DETAIL.tab !== 'chat' || $('detail').hidden){ clearInterval(CHAT.timer); CHAT.timer = null; return; }
    if (!document.hidden) chatPoll(false);
  }, 4000);
}
async function chatSend(text){
  if (CHAT.busy) return;
  const id = DETAIL.id, R = chatRoom(id);
  CHAT.busy = true;
  try {
    const res = await fetch(`${BACKEND}/api/chat/send`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ room:String(id), uid:CHAT.uid, name:PROFILE.name.trim(), text }) });
    const j = await res.json();
    if (!res.ok) { toastMsg(j.error || 'Message non envoyé.'); return false; }
    const m = j.message;
    CHAT.myUh = m.uh; try { localStorage.setItem('ce_uh', m.uh); } catch (e) {}
    if (!R.msgs.some(x => x.id === m.id)) { R.msgs.push(m); R.last = Math.max(R.last, m.id); }
    const l = $('chatlist'); if (l && DETAIL.id === id){ l.querySelectorAll('.chatempty').forEach(e => e.remove()); l.insertAdjacentHTML('beforeend', chatMsgHtml(m)); chatScrollBottom(true); }
    return true;
  } catch (e) { toastMsg('Message non envoyé.'); return false; }
  finally { CHAT.busy = false; }
}
function chatMount(){
  const f = $('chatform'), inp = $('chatin');
  if (f){
    inp.oninput = () => { CHAT.draft = inp.value; };
    f.onsubmit = async ev => {
      ev.preventDefault();
      const t = inp.value.trim(); if (!t) return;

      const ok = await chatSend(t);

  chatStartPolling();
}
/* appui long sur un message : signaler */
(function(){
  let timer = null, sx = 0, sy = 0;
  const sheet = (m) => {
    const old = $('chatSheet'); if (old) old.remove();
    const el = document.createElement('div'); el.id = 'chatSheet';
    el.innerHTML = `<div class="cs-back"></div><div class="cs-box"><div class="cs-msg">${esc(m.text)}</div><button class="cs-rep">${esc(I18N.tr('Signaler ce message'))}</button><button class="cs-no">${esc(I18N.tr('Annuler'))}</button></div>`;
    document.body.appendChild(el);
    const close = () => el.remove();
    el.querySelector('.cs-back').onclick = close; el.querySelector('.cs-no').onclick = close;
    el.querySelector('.cs-rep').onclick = async () => {
      close();
      const R = chatRoom(DETAIL.id);
      R.reported.add(m.id);
      const node = document.querySelector(`.cmsg[data-id="${m.id}"]`); if (node) node.remove();
      try { await fetch(`${BACKEND}/api/chat/report`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ room:String(DETAIL.id), id:m.id, uid:CHAT.uid }) }); } catch (e) {}
      toastMsg('Merci, ce message a été signalé.');
    };
  };
  const find = t => {
    const n = t.closest && t.closest('.cmsg'); if (!n || n.classList.contains('me')) return null;
    const R = chatRoom(DETAIL.id), id = Number(n.dataset.id);
    return R.msgs.find(x => x.id === id) || null;
  };
  const d = $('detail');
  d.addEventListener('touchstart', e => { const m = find(e.target); if (!m) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; timer = setTimeout(() => { timer = null; if (navigator.vibrate) try { navigator.vibrate(20); } catch (x) {} sheet(m); }, 500); }, { passive:true });
  d.addEventListener('touchmove', e => { if (timer && (Math.abs(e.touches[0].clientX - sx) > 10 || Math.abs(e.touches[0].clientY - sy) > 10)){ clearTimeout(timer); timer = null; } }, { passive:true });
  ['touchend', 'touchcancel'].forEach(ev => d.addEventListener(ev, () => { clearTimeout(timer); timer = null; }, { passive:true }));
  d.addEventListener('contextmenu', e => { const m = find(e.target); if (m){ e.preventDefault(); sheet(m); } });
})();

  }

  };
  $('dfav').onclick = () => { toggleFavMatch(g); syncFollow(); refreshList(); };
  box.querySelectorAll('.pp[data-name], .subtap[data-name]').forEach(el => el.onclick = () => {
    openPitchPlayer(el.dataset.side, el.dataset.name, el.dataset.n, g);
  });
  box.querySelectorAll('.sbtap').forEach(el => el.onclick = () => {
    const home = el.dataset.side === 'home';
    const id = home ? g.homeId : g.awayId;
    openTeam(id, g.leagueId, home ? g.home : g.away, home ? g.homeLogo : g.awayLogo);
  });
  box.querySelectorAll('.follow').forEach(b => b.onclick = () => {
    const home = b.dataset.side === 'home';
    const ok = toggleFavTeam(home ? g.homeId : g.awayId, home ? g.home : g.away, home ? g.homeLogo : g.awayLogo, g.leagueId);

    syncFollow(); refreshList();
  });
  box.querySelectorAll('.dtab').forEach(b => b.onclick = () => { DETAIL.userTab = true; DETAIL.tab = b.dataset.t; renderDetail(); });
  const r = $('dretry');
  if (r) r.onclick = () => { DETAIL.err = null; renderDetail(); loadDetail(); };
  const sr = $('sretry');
  if (sr) sr.onclick = () => { DETAIL.standErr = null; renderDetail(); };
  box.scrollTop = top;
}

/* ---------- Explorer : toutes les compétitions ---------- */
const COMP = { list:null, err:null, loading:false, q:'' };
const EX_PRIORITY = ['eurocups','Europe','World','Africa','England','Spain','Italy','Germany','France','Portugal','Netherlands','Belgium'];

async function loadCompetitions(){
  if (COMP.loading) return;
  COMP.loading = true; COMP.err = null;
  try {
    const { data, stale } = await apiGet(`${BACKEND}/api/competitions`);
    COMP.list = data.competitions || [];
  } catch (e) { COMP.err = e.message; }
  COMP.loading = false;
  if (state.page === 'explorer') renderExplorer();
}

function renderExplorer(){
  const main = $('main');
  if (COMP.err && !COMP.list){
    main.innerHTML = `<div class="empty">Impossible de charger les compétitions.<small>${esc(COMP.err).slice(0,200)}</small><button class="retry" id="cretry">Réessayer</button></div>`;
    $('cretry').onclick = () => { COMP.err = null; renderExplorer(); };
    return;
  }
  if (!COMP.list){
    main.innerHTML = `<div class="empty">Chargement des compétitions…<small>Le serveur gratuit peut mettre un moment à se réveiller.</small></div>`;
    loadCompetitions();
    return;
  }
  main.innerHTML = `<div class="exsearch"><input id="cq" type="search" placeholder="Joueur, club, pays ou compétition" value="${esc(COMP.q)}"></div><div id="exsres"></div><div id="exlist"></div>`;
  $('cq').oninput = e => { COMP.q = e.target.value; renderExplorerList(); scheduleSearch(); };
  renderExplorerList();
  scheduleSearch();
}


/* recherche de clubs et joueurs (index côté serveur) */
const SRCH = { t:null, res:null, q:'', seq:0, list:[] };
function scheduleSearch(){
  clearTimeout(SRCH.t);
  const q = COMP.q.trim();
  if (q.length < 2){ SRCH.res = null; renderSearchRes(); return; }
  SRCH.t = setTimeout(async () => {
    const my = ++SRCH.seq;
    try {
      const { data } = await apiGet(`${BACKEND}/api/search?q=${encodeURIComponent(q)}`);
      if (my !== SRCH.seq) return;
      SRCH.res = data; SRCH.q = q;
    } catch (e) { SRCH.res = null; }
    renderSearchRes();
  }, 350);
}
function renderSearchRes(){
  const box = $('exsres');
  if (!box) return;
  const r = SRCH.res;
  if (!r || COMP.q.trim().length < 2){ box.innerHTML = ''; return; }
  SRCH.list = r.players;
  const img = (u, cls) => u ? `<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=sph></span>'">` : '<span class="sph"></span>';
  let h = '';
  if (r.teams.length) h += `<div class="shead">Clubs et équipes</div><section class="group">` + r.teams.map(t =>
    `<div class="srow" data-k="t" data-tid="${esc(t.id)}" data-lid="${esc(t.leagueId)}" data-name="${esc(t.name)}" data-logo="${esc(t.badge || '')}">${img(SETTINGS.logos ? t.badge : null)}<div class="sn">${esc(trTeam(t.name))}<small>${esc(trComp(t.leagueName || ''))}</small></div><span class="chev">›</span></div>`).join('') + '</section>';
  if (r.players.length) h += `<div class="shead">Joueurs</div><section class="group">` + r.players.map((x, i) =>
    `<div class="srow" data-k="p" data-i="${i}">${img(x.player.photo)}<div class="sn">${esc(x.player.fullName || x.player.name)}<small>${esc(trTeam(x.team.name))}${x.player.position ? ' · ' + esc(x.player.position) : ''}</small></div><span class="chev">›</span></div>`).join('') + '</section>';
  if (!h && r.building) h = `<div class="empty" style="padding:20px 24px">Le serveur prépare la recherche de joueurs et de clubs (${r.indexed}/${r.total}). Réessaie dans un instant.</div>`;
  box.innerHTML = h;
}
$('main').addEventListener('click', e => {
  const el = e.target.closest('.srow'); if (!el) return;
  if (el.dataset.k === 't'){ openTeam(el.dataset.tid, el.dataset.lid, el.dataset.name, el.dataset.logo || null); return; }
  const x = SRCH.list[+el.dataset.i]; if (!x) return;
  PANEL.team = { id: String(x.team.id), leagueId: String(x.team.leagueId), name: x.team.name, logo: x.team.badge || null };
  PANEL.squad = null; PANEL.teamErr = null; PANEL.sub = 'player'; PANEL.player = x.player;
  openPanel('team'); loadSquad();
});

function renderExplorerList(){
  const box = $('exlist');
  if (!box || !COMP.list) return;
  const q = norm(COMP.q);
  const items = COMP.list.filter(c => !q || norm(`${c.name} ${trComp(c.name)} ${c.country} ${trCountry(c.country)}`).includes(q));
  if (!items.length){
    if (q.length >= 2){ box.innerHTML = `<div class="excount">Aucune compétition ne correspond.</div>`; return; }
    box.innerHTML = `<div class="empty">Aucune compétition ne correspond à « ${esc(COMP.q)} ».<small>La liste contient toutes les compétitions incluses dans ton abonnement de données (${COMP.list.length} au total).</small></div>`;
    return;
  }
  const groups = {};
  items.forEach(c => { (groups[c.country] = groups[c.country] || { country:c.country, flag:c.flag, items:[] }).items.push(c); });
  const rank = k => { const i = EX_PRIORITY.indexOf(k); return i < 0 ? 999 : i; };
  const ordered = Object.values(groups).sort((a,b) => rank(a.country) - rank(b.country) || trCountry(a.country).localeCompare(trCountry(b.country), 'fr'));
  box.innerHTML = `<div class="excount">${items.length} compétition${items.length > 1 ? 's' : ''}${q ? '' : (items.length > 1 ? ' disponibles' : ' disponible')}</div>` + ordered.map(g => {
    const flag = g.flag ? `<img src="${esc(g.flag)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
    const rows = g.items.sort((a,b) => String(a.name).localeCompare(String(b.name))).map(c => {
      const logo = (c.logo && SETTINGS.logos) ? `<img class="clogo" src="${esc(c.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add('ph');this.removeAttribute('src')">` : '<span class="clogo ph"></span>';
      return `<div class="crow" data-id="${esc(c.id)}">${logo}<div class="cname">${esc(trComp(c.name))}${c.season ? `<small>Saison ${esc(c.season)}</small>` : ''}</div><span class="chev">›</span></div>`;
    }).join('');
    return `<section class="group"><div class="lg">${flag}<span class="lgn">${esc(trCountry(g.country))}</span></div>${rows}</section>`;
  }).join('');
}

function openCompetition(id){
  const c = (COMP.list || []).find(x => x.id === id);
  if (!c) return;
  PANEL.comp = c; PANEL.games = null; PANEL.searched = undefined; PANEL.err = null; PANEL.scrolled = false; PANEL.ctab = 'matches'; PANEL.standErr = null; PANEL.standLoading = false;
  openPanel('competition');
  loadCompetitionGames(id);
}
async function loadCompetitionGames(id){
  try {
    const { data, stale } = await apiGet(`${BACKEND}/api/fixtures?league_id=${encodeURIComponent(id)}&from=${addDays(TODAY, -14)}&to=${addDays(TODAY, 30)}`);
    if (PANEL.kind !== 'competition' || !PANEL.comp || PANEL.comp.id !== id) return;
    PANEL.games = (data.games || []).map(localize);
    PANEL.searched = data.searched;   // période réellement cherchée par le serveur (absente = période habituelle ; null = derniers et prochains matchs)
    PANEL.games.forEach(g => { GAME_INDEX[g.id] = g; });
  } catch (e) {
    if (PANEL.kind !== 'competition' || !PANEL.comp || PANEL.comp.id !== id) return;
    PANEL.err = e.message;
  }
  renderPanel();
}

  const el = e.target.closest('.tr[data-tid]'); if (el) openTeam(el.dataset.tid, el.dataset.lid, el.dataset.name, el.dataset.logo || null); });

/* ---------- page Favoris ---------- */
async function loadFavGames(){
  if (FAVSTATE.loading) return;
  FAVSTATE.loading = true; FAVSTATE.err = null; FAVSTATE.dirty = false; FAVSTATE.failed = 0;
  renderFavoris();
  const from = addDays(TODAY, -7), to = addDays(TODAY, 14);
  const map = {};
  FAV.matches.forEach(m => { localize(m); map[m.id] = { ...m }; if (!GAME_INDEX[m.id]) GAME_INDEX[m.id] = map[m.id]; });

  const teams = FAV.teams.slice(0, 15);
  const results = await Promise.allSettled(teams.map(async t => {
    const { data, stale } = await apiGet(`${BACKEND}/api/fixtures?team_id=${encodeURIComponent(t.id)}&from=${from}&to=${to}`);
    return data.games || [];
  }));
  let firstErr = '';
  results.forEach(r => {
    if (r.status === 'fulfilled') r.value.forEach(g => { localize(g); map[g.id] = g; GAME_INDEX[g.id] = g; });
    else { FAVSTATE.failed++; firstErr = firstErr || (r.reason && r.reason.message) || 'Erreur'; }
  });

  // mettre à jour le score et le statut des matchs suivis
  const days = [...new Set(FAV.matches.map(m => m.date))].filter(d => d >= from && d <= to).slice(0, 4);
  await Promise.allSettled(days.map(async d => {
    const list = await getDay(d);
    list.forEach(g => {
      if (!isFavMatch(g.id)) return;
      map[g.id] = g; GAME_INDEX[g.id] = g;
      const i = FAV.matches.findIndex(m => m.id === String(g.id));
      if (i >= 0) FAV.matches[i] = snap(g);
    });
  }));
  try { localStorage.setItem('ce_favs', JSON.stringify(FAV)); } catch(e) {}

  FAVSTATE.games = Object.values(map);
  FAVSTATE.err = (teams.length && FAVSTATE.failed === teams.length && !FAV.matches.length) ? firstErr : null;
  FAVSTATE.ts = Date.now(); FAVSTATE.loading = false;
  renderFavoris();
}

function showFavoris(){
  if (state.page !== 'favoris') return;
  if (!FAV.teams.length && !FAV.matches.length){ FAVSTATE.games = []; FAVSTATE.dirty = false; renderFavoris(); return; }
  if (FAVSTATE.dirty || !FAVSTATE.games || Date.now() - FAVSTATE.ts > 60000) loadFavGames(); else renderFavoris();
}

function renderFavoris(){
  if (state.page !== 'favoris') return;
  const main = $('main');
  if (!FAV.teams.length && !FAV.matches.length){
    main.innerHTML = `<div class="empty">Tu n'as pas encore de favoris.<small>Ouvre un match, puis touche ☆ pour le suivre, ou « ☆ Suivre » sous une équipe pour voir ici ses prochains matchs et ses résultats.</small></div>`;
    return;
  }
  let html = '';
  if (FAV.teams.length){
    html += `<h3 class="ftitle">Mes équipes</h3><div class="chips">` + FAV.teams.map(t =>
      `<span class="fchip"><span class="fchip-tap" data-id="${esc(t.id)}" data-lid="${esc(t.leagueId||'')}" data-name="${esc(t.name)}" data-logo="${esc(t.logo||'')}">${crest(trTeam(t.name) || '', t.logo, 'sm')}<b>${esc(trTeam(t.name))}</b></span><i class="fx" data-rm="${esc(t.id)}" aria-label="Retirer">✕</i></span>`).join('') + `</div>`;
  }
  if (FAVSTATE.loading || !FAVSTATE.games){
    html += `<div class="empty">Chargement de tes favoris…<small>Le serveur gratuit peut mettre un moment à répondre.</small></div>`;
  } else if (FAVSTATE.err){
    html += `<div class="empty">Impossible de charger tes favoris.<small>${esc(FAVSTATE.err).slice(0,200)}</small><button class="retry" id="fretry">Réessayer</button></div>`;
  } else {
    const key = g => (g.date || '') + ' ' + (g.time || '');
    const up = FAVSTATE.games.filter(g => g.status !== 'final').sort((a,b) => key(a).localeCompare(key(b)));
    const past = FAVSTATE.games.filter(g => g.status === 'final').sort((a,b) => key(b).localeCompare(key(a)));
    const block = (title, list, desc) => {
      if (!list.length) return '';
      const by = {};
      list.forEach(g => (by[g.date] = by[g.date] || []).push(g));
      const dates = Object.keys(by).sort();
      if (desc) dates.reverse();
      return `<h3 class="ftitle">${title}</h3>` + dates.map(d => `<section class="group"><div class="lg"><span class="lgn">${esc(dayLabel(d))}</span></div>${
        by[d].sort((a,b) => desc ? (b.time || '').localeCompare(a.time || '') : (a.time || '').localeCompare(b.time || '')).map(matchRow).join('')}</section>`).join('');
    };
    html += block('À venir et en direct', up, false) + block('Résultats récents', past, true);
    if (!up.length && !past.length) html += `<div class="empty">Aucun match trouvé pour tes favoris entre le ${esc(dayLabel(addDays(TODAY, -7)))} et le ${esc(dayLabel(addDays(TODAY, 14)))}.</div>`;
    if (FAVSTATE.failed) html += `<div class="avail">${FAVSTATE.failed} équipe${FAVSTATE.failed > 1 ? 's' : ''} n'${FAVSTATE.failed > 1 ? 'ont' : 'a'} pas pu être chargée${FAVSTATE.failed > 1 ? 's' : ''}. Rouvre la page pour réessayer.</div>`;
  }
  main.innerHTML = html + `<div class="ver">Coup d'Envoi · ${VERSION}</div>`;
  const r = $('fretry');
  if (r) r.onclick = () => { FAVSTATE.dirty = true; showFavoris(); };
}
$('main').addEventListener('click', e => {
  const tap = e.target.closest('.fchip-tap');
  if (tap) { openTeam(tap.dataset.id, tap.dataset.lid, tap.dataset.name, tap.dataset.logo || null); return; }
  const x = e.target.closest('[data-rm]');
  if (!x) return;
  toggleFavTeam(x.dataset.rm);
  FAVSTATE.dirty = false;
  if (FAVSTATE.games) FAVSTATE.games = FAVSTATE.games.filter(isFavGame);
  renderFavoris();
});
