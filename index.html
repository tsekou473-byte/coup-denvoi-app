<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Coup d'Envoi</title>
<meta name="apple-mobile-web-app-title" content="Coup d'Envoi">
<meta name="theme-color" content="#131a2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1320; --card:#161d31; --card-head:#1b2440; --line:#252f4d;
  --text:#eef1f8; --muted:#8f9ab3; --accent:#ffb547; --live:#ff5a5f;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden]{ display:none !important; }
html{ font-size:14px; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
html,body{ margin:0; min-height:100%; }
body{ background:var(--bg); color:var(--text); font-family:'Barlow Semi Condensed',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
button{ font-family:inherit; color:inherit; }

/* en-tête */
header{ position:sticky; top:0; z-index:10; background:linear-gradient(180deg,#1b2340,#131a2e); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px); }
.top{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px 6px 16px; }
.brand{ display:flex; align-items:center; gap:9px; font-family:'Barlow Condensed',sans-serif; font-size:1.6rem; font-weight:600; letter-spacing:.02em; }
.brand svg{ width:27px; height:27px; }
.right{ display:flex; align-items:center; gap:0; }
.icon-btn{ width:42px; height:42px; border:none; background:none; display:flex; align-items:center; justify-content:center; position:relative; cursor:pointer; padding:0; }
.icon-btn svg{ width:25px; height:25px; }
.cal input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }
.search{ padding:2px 14px 8px; }
.search input{ width:100%; border:1px solid var(--line); border-radius:12px; background:var(--card-head); color:var(--text); padding:10px 12px; font-size:1rem; font-family:inherit; outline:none; }
.dates{ display:flex; gap:8px; overflow-x:auto; padding:2px 14px 12px; scrollbar-width:none; }
.dates::-webkit-scrollbar{ display:none; }
.date{
  flex-shrink:0; border:none; background:rgba(255,255,255,.06); padding:7px 14px; border-radius:999px;
  font-family:'Barlow Condensed',sans-serif; font-size:1.05rem; font-weight:500; letter-spacing:.03em;
  color:#b8c1d9; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px;
}
.date.active{ background:var(--accent); color:#1b1305; font-weight:600; }
.dot{ width:7px; height:7px; border-radius:50%; background:var(--live); animation:pulse 1.4s infinite; }
@keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.25 } }
.filterbar{ display:flex; align-items:center; gap:8px; padding:12px 14px 0; font-size:.95rem; color:var(--muted); }
.chip{ background:var(--card-head); border:1px solid var(--line); border-radius:999px; padding:4px 10px 4px 12px; color:var(--text); display:inline-flex; gap:8px; align-items:center; cursor:pointer; }

/* liste */
main{ padding:14px 10px 110px; max-width:640px; margin:0 auto; }
.group{ background:var(--card); border:1px solid var(--line); border-radius:18px; margin-bottom:14px; overflow:hidden; }
.lg{ display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--card-head); border-left:4px solid var(--accent); }
.lg img{ width:26px; height:18px; object-fit:cover; border-radius:3px; }
.lgn{ font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:1.1rem; letter-spacing:.05em; text-transform:uppercase; }
.lgc{ color:var(--muted); font-size:.9rem; text-transform:none; font-weight:400; letter-spacing:0; font-family:'Barlow Semi Condensed',sans-serif; }
.match{ display:grid; grid-template-columns:1fr auto 78px auto 1fr; align-items:center; gap:9px; padding:12px 12px; border-top:1px solid var(--line); }
.lg + .match{ border-top:none; }
.tn{ font-size:1.08rem; font-weight:500; line-height:1.15; overflow-wrap:anywhere; }
.tn.h{ text-align:right; }
.tn.a{ text-align:left; }
.crest{ width:42px; height:42px; border-radius:50%; background:var(--c,#555); position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.08); }
.crest img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#fff; border-radius:50%; padding:5px; }
.mid{ text-align:center; }
.score{ display:inline-block; font-family:'Barlow Condensed',sans-serif; font-size:1.7rem; font-weight:500; line-height:1; padding:5px 12px; border-radius:12px; background:rgba(255,255,255,.07); white-space:nowrap; }
.score.muted{ background:none; color:#cfd6e8; font-weight:400; padding:5px 0; }
.score.live{ color:var(--live); background:rgba(255,90,95,.12); }
.score.strike{ text-decoration:line-through; color:var(--muted); }
.sub{ font-size:.8rem; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-top:4px; font-weight:500; }
.sub.live{ color:var(--live); font-weight:600; }
.empty{ text-align:center; color:var(--muted); padding:60px 24px; font-size:1.05rem; line-height:1.5; }
.empty small{ display:block; margin-top:8px; font-size:.85rem; opacity:.85; word-break:break-word; }
.retry{ margin-top:16px; border:1px solid var(--line); background:var(--card-head); color:var(--text); padding:9px 18px; border-radius:12px; font-size:1rem; cursor:pointer; }
.ver{ text-align:center; color:#4d5878; font-size:.75rem; margin-top:8px; }

/* tiroir */
.scrim{ position:fixed; inset:0; background:rgba(0,0,0,.6); opacity:0; pointer-events:none; transition:opacity .2s; z-index:30; }
.scrim.open{ opacity:1; pointer-events:auto; }
.drawer{ position:fixed; top:0; bottom:0; right:0; width:80%; max-width:320px; background:#121829; border-left:1px solid var(--line); z-index:31; transform:translateX(100%); transition:transform .25s; padding:calc(20px + env(safe-area-inset-top,0px)) 8px 20px; overflow-y:auto; }
.drawer.open{ transform:none; }
.drawer h2{ margin:4px 14px 12px; font-family:'Barlow Condensed',sans-serif; font-size:1.5rem; }
.drawer h3{ margin:18px 14px 6px; font-size:.82rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:600; }
.d-item{ padding:13px 14px; border-radius:12px; font-size:1.1rem; cursor:pointer; display:flex; justify-content:space-between; }
.d-item:active{ background:var(--card-head); }
.d-item.sel{ background:var(--card-head); font-weight:600; }
.d-item.soon{ color:#5d6784; cursor:default; }

/* barre du bas */
.bottom-nav{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:#111828; display:flex; padding-bottom:env(safe-area-inset-bottom,0px); border-top:1px solid var(--line); }
.nav-item{ flex:1; position:relative; border:none; background:none; padding:10px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; color:#7f8aa6; cursor:pointer; }
.nav-item svg{ width:25px; height:25px; }
.nav-item span{ font-size:.8rem; }
.nav-item.active{ color:var(--accent); }
.nav-item.active::before{ content:''; position:absolute; top:0; width:30px; height:3px; background:var(--accent); border-radius:0 0 4px 4px; }

/* détail d'un match */
.match{ cursor:pointer; }
.match:active{ background:rgba(255,255,255,.04); }
.detail{ position:fixed; inset:0; z-index:40; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:50px; animation:slideIn .22s ease; }
@keyframes slideIn{ from{ transform:translateX(28px); opacity:0 } to{ transform:none; opacity:1 } }
.dh{ position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:4px; padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px 6px; background:linear-gradient(180deg,#1b2340,#131a2e); border-bottom:1px solid var(--line); }
.dh .ttl{ flex:1; min-width:0; }
.dh .ttl b{ display:block; font-family:'Barlow Condensed',sans-serif; font-size:1.2rem; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dh .ttl small{ color:var(--muted); font-size:.9rem; }
.sb{ display:grid; grid-template-columns:1fr auto 1fr; gap:6px; align-items:start; padding:22px 12px 8px; max-width:640px; margin:0 auto; }
.sbteam{ display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; font-size:1.15rem; font-weight:500; line-height:1.15; }
.crest.big{ width:60px; height:60px; font-size:1rem; }
.sbmid{ text-align:center; padding-top:8px; min-width:108px; }
.sbmid .score{ font-size:2.5rem; padding:5px 14px; }
.sbmid .score.muted{ font-size:2.2rem; }
.sbmid .sub{ margin-top:9px; }
.meta{ text-align:center; color:var(--muted); font-size:.92rem; padding:6px 18px 14px; line-height:1.5; }
.dtabs{ display:flex; gap:8px; padding:4px 12px 14px; max-width:640px; margin:0 auto; }
.dtab{ flex:1; border:none; background:rgba(255,255,255,.06); padding:9px 0; border-radius:999px; font-family:'Barlow Condensed',sans-serif; font-size:1.08rem; letter-spacing:.05em; text-transform:uppercase; color:#b8c1d9; cursor:pointer; }
.dtab.active{ background:var(--accent); color:#1b1305; font-weight:600; }
.card2{ background:var(--card); border:1px solid var(--line); border-radius:18px; margin:0 10px 14px; overflow:hidden; max-width:620px; }
@media (min-width:660px){ .card2{ margin-left:auto; margin-right:auto; } }
.noev{ text-align:center; color:var(--muted); padding:34px 18px; font-size:1.05rem; }
.ev{ display:grid; grid-template-columns:1fr 60px 1fr; align-items:center; gap:6px; padding:11px 12px; border-top:1px solid var(--line); }
.ev:first-child{ border-top:none; }
.ev .min{ text-align:center; font-family:'Barlow Condensed',sans-serif; font-size:1.05rem; color:#c8cfe0; background:rgba(255,255,255,.07); border-radius:999px; padding:2px 0; }
.ev .l{ display:flex; justify-content:flex-end; align-items:center; gap:8px; text-align:right; }
.ev .r{ display:flex; justify-content:flex-start; align-items:center; gap:8px; text-align:left; }
.ev .ic{ font-size:1.15rem; flex-shrink:0; }
.ev .tx{ line-height:1.15; min-width:0; }
.ev .tx b{ font-weight:600; font-size:1.05rem; display:block; overflow-wrap:anywhere; }
.ev .tx small{ display:block; color:var(--muted); font-size:.85rem; margin-top:1px; }
.tx b.in{ color:#5ad19a; font-weight:500; }
.tx small.out{ color:#ff7b7f; font-size:.95rem; }
.sep{ text-align:center; color:var(--accent); font-family:'Barlow Condensed',sans-serif; letter-spacing:.08em; text-transform:uppercase; padding:9px; background:var(--card-head); border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-size:.98rem; }
.ev + .sep:last-child{ border-bottom:none; }
.lu{ display:grid; grid-template-columns:1fr 1fr; }
.lucol{ padding:14px 12px; min-width:0; }
.lucol + .lucol{ border-left:1px solid var(--line); }
.lucol h4{ margin:0 0 10px; font-size:1.15rem; font-weight:600; }
.lucol h4 small{ color:var(--accent); font-weight:500; margin-left:4px; }
.lucol h5{ margin:14px 0 6px; font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:500; }
.pl{ display:flex; gap:8px; padding:4px 0; align-items:baseline; line-height:1.15; }
.pl b{ width:24px; flex-shrink:0; color:var(--accent); font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:1.05rem; text-align:right; }
.pl span{ overflow-wrap:anywhere; }
.st{ padding:11px 14px; border-top:1px solid var(--line); }
.st:first-child{ border-top:none; }
.stl{ text-align:center; color:var(--muted); font-size:.9rem; margin-bottom:6px; }
.str{ display:grid; grid-template-columns:54px 1fr 54px; gap:8px; align-items:center; }
.stv{ font-weight:600; font-size:1.08rem; }
.stv.r{ text-align:right; }
.bar{ display:flex; gap:3px; height:7px; }
.bar i{ display:block; border-radius:4px; }
.bh{ background:var(--accent); }
.ba{ background:#6ea8ff; }

/* panneaux : réglages et compte */
.panel{ z-index:45; }
.set{ margin-top:14px; }
.set .row{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 16px; border-top:1px solid var(--line); }
.set .row:first-child{ border-top:none; }
.set .row.tap{ cursor:pointer; }
.set .row.col{ flex-direction:column; align-items:stretch; }
.rl b{ display:block; font-size:1.05rem; font-weight:600; }
.rl small{ display:block; color:var(--muted); font-size:.85rem; margin-top:2px; line-height:1.3; }
.seg{ display:flex; background:rgba(255,255,255,.07); border-radius:999px; padding:3px; flex-shrink:0; }
.seg button{ border:none; background:none; padding:6px 12px; border-radius:999px; font-family:'Barlow Condensed',sans-serif; font-size:1.02rem; letter-spacing:.03em; color:#b8c1d9; cursor:pointer; }
.seg button.on{ background:var(--accent); color:#1b1305; font-weight:600; }
.sw{ position:relative; width:46px; height:28px; flex-shrink:0; }
.sw input{ position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; z-index:1; cursor:pointer; }
.sw i{ position:absolute; inset:0; background:#3a4463; border-radius:999px; transition:.2s; pointer-events:none; }
.sw i::after{ content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:.2s; }
.sw input:checked + i{ background:var(--accent); }
.sw input:checked + i::after{ transform:translateX(18px); background:#1b1305; }
.acc{ text-align:center; padding:26px 22px 6px; max-width:420px; margin:0 auto; }
.acc h3{ margin:14px 0 6px; font-family:'Barlow Condensed',sans-serif; font-size:1.7rem; font-weight:600; }
.acc p{ color:var(--muted); line-height:1.45; margin:0 0 18px; font-size:1rem; }
.avatar{ width:34px; height:34px; border-radius:50%; background:var(--accent); color:#1b1305; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:1.15rem; }
.avatar.big{ width:84px; height:84px; margin:0 auto; font-size:2.4rem; background:var(--card-head); color:var(--muted); border:1px solid var(--line); }
.avatar.big.has{ background:var(--accent); color:#1b1305; }
.btn{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border:1px solid var(--line); background:var(--card-head); color:var(--text); padding:13px 16px; border-radius:14px; font-size:1.05rem; font-weight:600; cursor:pointer; margin-bottom:10px; }
.btn.primary{ background:var(--accent); color:#1b1305; border-color:var(--accent); }
.btn.small{ width:auto; margin:0; padding:9px 16px; font-size:1rem; flex-shrink:0; }
.soon-tag{ font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; background:rgba(0,0,0,.18); padding:2px 8px; border-radius:999px; font-weight:600; }
.btn:not(.primary) .soon-tag{ background:rgba(255,255,255,.1); color:var(--muted); }
.note{ background:var(--card-head); border:1px solid var(--line); border-radius:12px; padding:11px 14px; color:#cfd6e8; font-size:.95rem; line-height:1.4; margin-bottom:10px; text-align:left; }
.nm{ display:flex; gap:10px; margin-top:12px; }
.nm input{ flex:1; min-width:0; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--text); padding:10px 12px; font-size:1.05rem; font-family:inherit; outline:none; }
.pill{ font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); padding:2px 8px; border-radius:999px; align-self:center; }
.dtab.dim{ opacity:.5; }
.avail{ text-align:center; color:#66708f; font-size:.82rem; padding:0 22px 6px; line-height:1.4; max-width:620px; margin:0 auto; }
.chev{ color:var(--muted); font-size:1.4rem; line-height:1; }

/* compositions sur le terrain */
.pitchwrap{ overflow:hidden; }
.pl-top{ display:flex; justify-content:space-between; align-items:baseline; padding:11px 14px; background:var(--card-head); font-size:1.05rem; }
.pl-top b{ font-weight:600; }
.pl-top span{ color:var(--accent); font-family:'Barlow Condensed',sans-serif; font-size:1.15rem; letter-spacing:.06em; }
.pitch{ position:relative; display:flex; flex-direction:column; gap:16px; padding:18px 6px 18px; background:linear-gradient(180deg,#14335e,#0f2a4d 50%,#14335e); }
.prow{ display:flex; justify-content:space-around; align-items:flex-start; position:relative; z-index:1; }
.half{ position:relative; height:2px; background:rgba(255,255,255,.22); margin:4px 8px; }
.half::after{ content:''; position:absolute; left:50%; top:50%; width:64px; height:64px; margin:-32px 0 0 -32px; border:2px solid rgba(255,255,255,.22); border-radius:50%; }
.pp{ width:58px; display:flex; flex-direction:column; align-items:center; }
.pn{ position:relative; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:1.1rem; box-shadow:0 2px 6px rgba(0,0,0,.35); }
.pp.h .pn{ background:var(--accent); color:#1b1305; }
.pp.a .pn{ background:#6ea8ff; color:#0b1530; }
.pnm{ margin-top:4px; font-size:.78rem; text-align:center; line-height:1.1; overflow-wrap:anywhere; text-shadow:0 1px 2px rgba(0,0,0,.7); font-weight:500; }
.cd{ position:absolute; top:-4px; right:-6px; width:9px; height:12px; border-radius:2px; box-shadow:0 0 0 1px rgba(0,0,0,.35); }
.cd.y{ background:#ffd43b; }
.cd.r{ background:#ff4d4f; }
.so{ position:absolute; bottom:-5px; right:-7px; font-size:.8rem; font-style:normal; color:#ff7b7f; font-weight:700; text-shadow:0 0 3px #000; }
.legend{ text-align:center; color:#7f8aa6; font-size:.82rem; padding:0 16px 10px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#ffb547"/><path d="M12 6.4 16.5 9.6 14.8 15h-5.6L7.5 9.6Z" fill="#0e1320"/></svg>
      Coup d'Envoi
    </div>
    <div class="right">
      <label class="icon-btn cal" aria-label="Choisir une date">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01M16 17h.01" stroke-width="2.4"/></svg>
        <input type="date" id="datePick">
      </label>
      <button class="icon-btn" id="searchBtn" aria-label="Rechercher">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      </button>
      <button class="icon-btn" id="accBtn" aria-label="Mon compte"></button>
      <button class="icon-btn" id="burger" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
    </div>
  </div>
  <div class="search" id="searchRow" hidden><input id="q" type="search" placeholder="Rechercher une équipe ou une compétition"></div>
  <div class="dates" id="dates"></div>
</header>
<div class="filterbar" id="filterBar" hidden></div>
<main id="main"></main>

<div class="detail" id="detail" hidden></div>
<div class="detail panel" id="panel" hidden></div>
<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer">
  <h2>Menu</h2>
  <h3>Compétitions</h3>
  <div id="leagueList"></div>
  <h3>Application</h3>
  <div class="d-item" id="dSettings">Réglages</div>
  <div class="d-item" id="dAccount">Mon compte <span class="pill">Facultatif</span></div>
  <h3>Bientôt</h3>
  <div class="d-item soon">Équipes</div>
  <div class="d-item soon">Joueurs</div>
</nav>

<nav class="bottom-nav" id="bottomNav">
  <button class="nav-item active" data-page="matchs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 12h18M12 5v14"/><circle cx="12" cy="12" r="2.5"/></svg><span>Matchs</span>
  </button>
  <button class="nav-item" data-page="favoris">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.6 5.6 6 .7-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6-4.4-4.2 6-.7L12 3Z"/></svg><span>Favoris</span>
  </button>
  <button class="nav-item" data-page="explorer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m14.5 9.5-1.8 4.2-4.2 1.8 1.8-4.2 4.2-1.8Z"/></svg><span>Explorer</span>
  </button>
  <button class="nav-item" data-page="transferts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h13M17 8l-3-3M17 8l-3 3"/><path d="M20 16H7M7 16l3-3M7 16l3 3"/></svg><span>Transferts</span>
  </button>
  <button class="nav-item" data-page="infos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11a2 2 0 0 1 2 2v13a1 1 0 0 1-1.6.8L14 18H6a2 2 0 0 1-2-2V4Z"/><path d="M8 8h6M8 11h6"/></svg><span>Infos</span>
  </button>
</nav>

<script>
const BACKEND = 'https://coup-denvoi-backend.onrender.com';
const VERSION = 'v7';

const JOURS = ['DIM.','LUN.','MAR.','MER.','JEU.','VEN.','SAM.'];
const MOIS = ['JANV.','FÉVR.','MARS','AVR.','MAI','JUIN','JUIL.','AOÛT','SEPT.','OCT.','NOV.','DÉC.'];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- réglages et profil (enregistrés sur l'appareil) ---------- */
const SETTINGS = { size:'normal', fr:true, auto:true };
const PROFILE = { name:'' };
try { Object.assign(SETTINGS, JSON.parse(localStorage.getItem('ce_settings') || '{}')); } catch(e) {}
try { Object.assign(PROFILE, JSON.parse(localStorage.getItem('ce_profile') || '{}')); } catch(e) {}
const saveSettings = () => { try { localStorage.setItem('ce_settings', JSON.stringify(SETTINGS)); } catch(e) {} };
const saveProfile = () => { try { localStorage.setItem('ce_profile', JSON.stringify(PROFILE)); } catch(e) {} };
const SIZES = { small:'12.5px', normal:'14px', large:'16px' };
function applySize(){ document.documentElement.style.fontSize = SIZES[SETTINGS.size] || SIZES.normal; }
applySize();

/* ---------- noms en français (sélections, pays, compétitions) ---------- */
const FR_COUNTRIES = {
  'Albania':'Albanie','Andorra':'Andorre','Armenia':'Arménie','Austria':'Autriche','Azerbaijan':'Azerbaïdjan','Belarus':'Biélorussie',
  'Belgium':'Belgique','Bosnia & Herzegovina':'Bosnie-Herzégovine','Bosnia and Herzegovina':'Bosnie-Herzégovine','Bosnia-Herzegovina':'Bosnie-Herzégovine',
  'Bulgaria':'Bulgarie','Croatia':'Croatie','Cyprus':'Chypre','Czech Republic':'Tchéquie','Czechia':'Tchéquie','Denmark':'Danemark','England':'Angleterre',
  'Estonia':'Estonie','Faroe Islands':'Îles Féroé','Finland':'Finlande','Georgia':'Géorgie','Germany':'Allemagne','Greece':'Grèce','Hungary':'Hongrie',
  'Iceland':'Islande','Ireland':'Irlande','Republic of Ireland':'Irlande','Israel':'Israël','Italy':'Italie','Latvia':'Lettonie','Lithuania':'Lituanie',
  'Malta':'Malte','Moldova':'Moldavie','Montenegro':'Monténégro','Netherlands':'Pays-Bas','North Macedonia':'Macédoine du Nord','Northern Ireland':'Irlande du Nord',
  'Norway':'Norvège','Poland':'Pologne','Romania':'Roumanie','Russia':'Russie','San Marino':'Saint-Marin','Scotland':'Écosse','Serbia':'Serbie',
  'Slovakia':'Slovaquie','Slovenia':'Slovénie','Spain':'Espagne','Sweden':'Suède','Switzerland':'Suisse','Turkey':'Turquie','Türkiye':'Turquie','Wales':'Pays de Galles',
  'Argentina':'Argentine','Brazil':'Brésil','Chile':'Chili','Colombia':'Colombie','Ecuador':'Équateur','Peru':'Pérou','Bolivia':'Bolivie','Mexico':'Mexique',
  'USA':'États-Unis','United States':'États-Unis','Jamaica':'Jamaïque','Haiti':'Haïti','Morocco':'Maroc','Algeria':'Algérie','Tunisia':'Tunisie','Egypt':'Égypte',
  'Senegal':'Sénégal','Cameroon':'Cameroun','Ivory Coast':"Côte d'Ivoire",'South Africa':'Afrique du Sud','DR Congo':'RD Congo','Cape Verde':'Cap-Vert','Guinea':'Guinée',
  'Zambia':'Zambie','Japan':'Japon','South Korea':'Corée du Sud','China':'Chine','Australia':'Australie','Iraq':'Irak','Saudi Arabia':'Arabie saoudite',
  'United Arab Emirates':'Émirats arabes unis','Uzbekistan':'Ouzbékistan','India':'Inde','New Zealand':'Nouvelle-Zélande','Netherlands Antilles':'Antilles néerlandaises',
  'Europe':'Europe','eurocups':'Europe','World':'Monde'
};
function trCountry(n){ return SETTINGS.fr ? (FR_COUNTRIES[n] || n || '') : (n === 'eurocups' ? 'Europe' : (n || '')); }
function trTeam(n){
  if (!SETTINGS.fr || !n) return n || '';
  const m = String(n).match(/^(.+?)(\s+(?:U\d{2}|W))?$/);
  const fr = m && FR_COUNTRIES[m[1]];
  return fr ? fr + (m[2] || '') : n;
}
function trComp(c){
  if (!SETTINGS.fr) return c || '';
  return String(c || '')
    .replace(/UEFA Champions League/i, 'Ligue des champions UEFA')
    .replace(/UEFA (Europa )?Conference League/i, 'Ligue Europa Conférence UEFA')
    .replace(/UEFA Europa League/i, 'Ligue Europa UEFA')
    .replace(/UEFA Nations League/i, 'Ligue des nations UEFA')
    .replace(/World Cup/i, 'Coupe du monde')
    .replace(/Qualification|Qualifiers?/i, 'Éliminatoires')
    .replace(/\bLeague ([A-D])\b/, 'Ligue $1')
    .replace(/ - /g, ' · ');
}

function isoOf(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fromIso(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(iso, n){ const d = fromIso(iso); d.setDate(d.getDate()+n); return isoOf(d); }
const TODAY = isoOf(new Date());

function dayLabel(iso){
  const diff = Math.round((fromIso(iso) - fromIso(TODAY)) / 86400000);
  if (diff === -1) return 'HIER';
  if (diff === 0) return "AUJOURD'HUI";
  if (diff === 1) return 'DEMAIN';
  const d = fromIso(iso);
  return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`;
}

/* ---------- état ---------- */
const state = { sel: TODAY, extra: null, q: '', league: 'ALL', page: 'matchs' };
const cache = {};          // iso -> { games, ts }
const GAME_INDEX = {};     // id -> match (pour ouvrir le détail)
let reqId = 0;

const LEAGUES = [
  { id:'ALL',  name:'Toutes les compétitions' },
  { id:'LDC',  name:'Ligue des Champions', test:g => /champions league/i.test(g.comp||'') },
  { id:'PL',   name:'Premier League',      test:g => /^premier league$/i.test(g.comp||'') && /england/i.test(g.country||'') },
  { id:'LIGA', name:'La Liga',             test:g => /^la liga$/i.test(g.comp||'') && /spain/i.test(g.country||'') },
  { id:'L1',   name:'Ligue 1',             test:g => /^ligue 1$/i.test(g.comp||'') && /france/i.test(g.country||'') },
  { id:'BL',   name:'Bundesliga',          test:g => /^bundesliga$/i.test(g.comp||'') && /germany/i.test(g.country||'') },
  { id:'SA',   name:'Serie A',             test:g => /^serie a$/i.test(g.comp||'') && /italy/i.test(g.country||'') }
];

/* ---------- données ---------- */
async function getDay(iso, force){
  const c = cache[iso];
  if (c && !force && Date.now() - c.ts < 60000) return c.games;
  const res = await fetch(`${BACKEND}/api/fixtures?from=${iso}&to=${iso}`);
  let data = {};
  try { data = await res.json(); } catch(e) {}
  if (!res.ok || data.error) throw new Error((data.detail || data.error || ('Erreur ' + res.status)).toString());
  cache[iso] = { games: data.games || [], ts: Date.now() };
  cache[iso].games.forEach(g => { GAME_INDEX[g.id] = g; });
  return cache[iso].games;
}
function liveCount(){
  const c = cache[TODAY];
  return c ? c.games.filter(g => g.status === 'live').length : 0;
}

/* ---------- onglets de dates ---------- */
function dateKeys(){
  const set = new Set();
  for (let o = -6; o <= 6; o++) set.add(addDays(TODAY, o));
  if (state.extra) set.add(state.extra);
  if (/^\d{4}-\d{2}-\d{2}$/.test(state.sel)) set.add(state.sel);
  return [...set].sort();
}
function renderDates(){
  const box = $('dates');
  let html = '';
  dateKeys().forEach(iso => {
    html += `<button class="date ${state.sel===iso?'active':''}" data-k="${iso}">${dayLabel(iso)}</button>`;
    if (iso === TODAY){
      const n = liveCount();
      html += `<button class="date ${state.sel==='live'?'active':''}" data-k="live">${n?'<i class="dot"></i>':''}EN DIRECT${n?` (${n})`:''}</button>`;
    }
  });
  box.innerHTML = html;
  box.querySelectorAll('.date').forEach(b => b.onclick = () => { state.sel = b.dataset.k; renderDates(); show(); });
  const active = box.querySelector('.date.active');
  if (active) box.scrollLeft = active.offsetLeft - box.clientWidth/2 + active.clientWidth/2;
}

/* ---------- rendu des matchs ---------- */
const CREST_COLORS = ['#5b3a9a','#9a2a3a','#2a5aa8','#2f7d5b','#c8742a','#2a3a7a','#8a3a7a','#2a7a7a'];
function crest(name, logo, cls=''){
  let h = 0;
  for (let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  const initials = name.split(' ').filter(w => w.length>2 || /^[A-Z]/.test(w)).slice(0,2).map(w => w[0]).join('').toUpperCase().slice(0,2) || name.slice(0,2).toUpperCase();
  const img = logo ? `<img src="${esc(logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  return `<span class="crest ${cls}" style="--c:${CREST_COLORS[h % CREST_COLORS.length]}">${esc(initials)}${img}</span>`;
}

function middle(g){
  const score = `${g.hs ?? 0} - ${g.as ?? 0}`;
  if (g.status === 'final') return `<div class="mid"><div class="score">${score}</div><div class="sub">Terminé</div></div>`;
  if (g.status === 'live'){
    let m = g.minute ? String(g.minute) : 'LIVE';
    if (/^\d+$/.test(m)) m += "'";
    return `<div class="mid"><div class="score live">${score}</div><div class="sub live">${esc(m)}</div></div>`;
  }
  if (g.status === 'postponed') return `<div class="mid"><div class="score muted strike">${esc(g.time||'')}</div><div class="sub">Reporté</div></div>`;
  return `<div class="mid"><div class="score muted">${esc(g.time||'--:--')}</div></div>`;
}

function priority(g){
  const c = g.comp || '', k = g.country || '';
  if (/champions league/i.test(c)) return 0;
  if (/europa league|conference league/i.test(c)) return 1;
  if (/^premier league$/i.test(c) && /england/i.test(k)) return 2;
  if (/^la liga$/i.test(c)) return 3;
  if (/^ligue 1$/i.test(c)) return 4;
  if (/^bundesliga$/i.test(c) && /germany/i.test(k)) return 5;
  if (/^serie a$/i.test(c)) return 6;
  if (/nations league|world cup|euro|qualif/i.test(c)) return 7;
  return 100;
}

function renderGames(list){
  const main = $('main');
  const q = state.q.trim().toLowerCase();
  const lg = LEAGUES.find(l => l.id === state.league);
  let games = list;
  if (state.sel === 'live') games = games.filter(g => g.status === 'live');
  if (lg && lg.test) games = games.filter(lg.test);
  if (q) games = games.filter(g => `${g.home} ${g.away} ${trTeam(g.home)} ${trTeam(g.away)} ${g.comp} ${trComp(g.comp)} ${g.country} ${trCountry(g.country)}`.toLowerCase().includes(q));

  if (!games.length){
    const why = state.sel === 'live' ? 'Aucun match en direct pour le moment.'
              : (lg && lg.test) ? `Aucun match de ${lg.name} ce jour-là.`
              : 'Aucun match ce jour-là.';
    main.innerHTML = `<div class="empty">${why}</div><div class="ver">Coup d'Envoi · ${VERSION}</div>`;
    return;
  }

  const groups = {};
  games.forEach(g => {
    const key = `${g.country}|${g.comp}`;
    (groups[key] = groups[key] || { comp:g.comp, country:g.country, flag:g.countryLogo, p:priority(g), items:[] }).items.push(g);
  });
  const ordered = Object.values(groups).sort((a,b) => a.p - b.p || (a.country||'').localeCompare(b.country||'') || (a.comp||'').localeCompare(b.comp||''));

  main.innerHTML = ordered.map(gr => {
    const rows = gr.items.sort((a,b) => (a.time||'').localeCompare(b.time||'')).map(g => `
      <div class="match" data-id="${esc(g.id)}">
        <div class="tn h">${esc(trTeam(g.home))}</div>${crest(trTeam(g.home) || '', g.homeLogo)}
        ${middle(g)}
        ${crest(trTeam(g.away) || '', g.awayLogo)}<div class="tn a">${esc(trTeam(g.away))}</div>
      </div>`).join('');
    const flag = gr.flag ? `<img src="${esc(gr.flag)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
    return `<section class="group"><div class="lg">${flag}<span class="lgn">${esc(trComp(gr.comp))} <span class="lgc">· ${esc(trCountry(gr.country))}</span></span></div>${rows}</section>`;
  }).join('') + `<div class="ver">Coup d'Envoi · ${VERSION}</div>`;
}

async function show(){
  if (state.page !== 'matchs') return;
  const my = ++reqId;
  const iso = state.sel === 'live' ? TODAY : state.sel;
  const main = $('main');
  if (!cache[iso] || Date.now() - cache[iso].ts >= 60000){
    main.innerHTML = `<div class="empty">Chargement des matchs…<small>Le serveur gratuit peut mettre jusqu'à 50 secondes à se réveiller.</small></div>`;
  }
  let games;
  try {
    games = await getDay(iso);
  } catch (e) {
    if (my !== reqId) return;
    main.innerHTML = `<div class="empty">Impossible de charger les matchs.<small>${esc(e.message).slice(0,200)}</small><button class="retry" id="retry">Réessayer</button></div>`;
    $('retry').onclick = () => { delete cache[iso]; show(); };
    return;
  }
  if (my !== reqId) return;
  renderDates();
  renderGames(games);
}

/* ---------- filtre compétition (tiroir) ---------- */
function renderFilterBar(){
  const bar = $('filterBar');
  const lg = LEAGUES.find(l => l.id === state.league);
  if (!lg || lg.id === 'ALL' || state.page !== 'matchs'){ bar.hidden = true; return; }
  bar.hidden = false;
  bar.innerHTML = `Filtre <span class="chip" id="clearFilter">${esc(lg.name)} <b>✕</b></span>`;
  $('clearFilter').onclick = () => setLeague('ALL');
}
function renderLeagueList(){
  $('leagueList').innerHTML = LEAGUES.map(l => `<div class="d-item ${state.league===l.id?'sel':''}" data-id="${l.id}">${esc(l.name)}${state.league===l.id?'<span>✓</span>':''}</div>`).join('');
  $('leagueList').querySelectorAll('.d-item').forEach(el => el.onclick = () => { setLeague(el.dataset.id); closeDrawer(); });
}
function setLeague(id){
  state.league = id;
  renderLeagueList(); renderFilterBar();
  if (cache[state.sel === 'live' ? TODAY : state.sel]) renderGames(cache[state.sel === 'live' ? TODAY : state.sel].games);
  else show();
}

/* ---------- interactions ---------- */
function openDrawer(){ $('drawer').classList.add('open'); $('scrim').classList.add('open'); }
function closeDrawer(){ $('drawer').classList.remove('open'); $('scrim').classList.remove('open'); }
$('burger').onclick = openDrawer;
$('scrim').onclick = closeDrawer;

$('searchBtn').onclick = () => {
  const row = $('searchRow');
  row.hidden = !row.hidden;
  if (!row.hidden) $('q').focus(); else { $('q').value = ''; state.q = ''; refreshList(); }
};
$('q').oninput = e => { state.q = e.target.value; refreshList(); };
function refreshList(){
  const iso = state.sel === 'live' ? TODAY : state.sel;
  if (cache[iso]) renderGames(cache[iso].games);
}

$('datePick').onchange = e => {
  const v = e.target.value;
  if (!v) return;
  state.extra = v; state.sel = v;
  renderDates(); show();
};

const STUBS = {
  favoris:'Ajoute des équipes en favoris pour les retrouver ici.',
  explorer:'Explore les compétitions et classements du monde entier.',
  transferts:'Suis les derniers transferts et rumeurs du mercato.',
  infos:'Les actus et articles sur le football, bientôt ici.'
};
document.querySelectorAll('.nav-item').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.page = btn.dataset.page;
  const isMatchs = state.page === 'matchs';
  $('dates').hidden = !isMatchs;
  if (isMatchs){ renderDates(); renderFilterBar(); show(); }
  else { $('filterBar').hidden = true; reqId++; $('main').innerHTML = `<div class="empty">${STUBS[state.page]}</div>`; }
});

/* rafraîchissement automatique quand des matchs sont en direct */
setInterval(async () => {
  if (!SETTINGS.auto || document.hidden || state.page !== 'matchs') return;
  const iso = state.sel === 'live' ? TODAY : state.sel;
  if (iso !== TODAY || liveCount() === 0) return;
  try { await getDay(TODAY, true); renderDates(); refreshList(); } catch(e) {}
}, 90000);


/* ---------- détail d'un match ---------- */
const DETAIL = { id:null, tab:'resume', data:null, err:null, timer:null };
const STAT_FR = {
  'shots total':'Tirs','shots on goal':'Tirs cadrés','shots off goal':'Tirs non cadrés','shots blocked':'Tirs bloqués',
  'shots inside box':'Tirs dans la surface','shots outside box':'Tirs hors de la surface','fouls':'Fautes','corners':'Corners',
  'offsides':'Hors-jeu','ball possession':'Possession','yellow cards':'Cartons jaunes','red cards':'Cartons rouges',
  'saves':'Arrêts','passes total':'Passes','passes accurate':'Passes réussies','attacks':'Attaques',
  'dangerous attacks':'Attaques dangereuses','substitution':'Remplacements','throw in':'Touches','goals kicks':'Six mètres',
  'penalty':'Penaltys','injuries':'Blessures','free kick':'Coups francs','tackles':'Tacles'
};
const statName = t => STAT_FR[String(t||'').trim().toLowerCase()] || String(t||'');
const minOf = t => { const m = String(t||'').match(/(\d+)(?:\s*\+\s*(\d+))?/); return m ? Number(m[1]) + (m[2] ? Number(m[2])/100 : 0) : 0; };

function openMatch(id){
  const g = GAME_INDEX[id];
  if (!g) return;
  DETAIL.id = id; DETAIL.tab = 'resume'; DETAIL.data = null; DETAIL.err = null;
  const box = $('detail');
  box.hidden = false; box.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  history.pushState({ d:1 }, '');
  renderDetail();
  loadDetail();
  clearInterval(DETAIL.timer);
  DETAIL.timer = setInterval(() => {
    const cur = DETAIL.data || GAME_INDEX[DETAIL.id];
    if (SETTINGS.auto && !document.hidden && cur && cur.status === 'live') loadDetail(true);
  }, 60000);
}
function hideDetail(){
  $('detail').hidden = true;
  document.body.style.overflow = ($('panel').hidden ? '' : 'hidden');
  clearInterval(DETAIL.timer);
  DETAIL.id = null;
}
function backFromDetail(){ if (history.state && history.state.d) history.back(); else hideDetail(); }
window.addEventListener('popstate', () => { if (!$('panel').hidden) hidePanel(); else if (!$('detail').hidden) hideDetail(); });
$('main').addEventListener('click', e => {
  const m = e.target.closest('.match');
  if (m) openMatch(m.dataset.id);
});

async function loadDetail(silent){
  const id = DETAIL.id;
  if (!id) return;
  const g = GAME_INDEX[id];
  try {
    const res = await fetch(`${BACKEND}/api/match?id=${encodeURIComponent(id)}&date=${encodeURIComponent(g.date)}`);
    let data = {};
    try { data = await res.json(); } catch(e) {}
    if (!res.ok || data.error) throw new Error((data.detail || data.error || ('Erreur ' + res.status)).toString());
    if (DETAIL.id !== id) return;
    DETAIL.data = data; DETAIL.err = null;
    Object.assign(GAME_INDEX[id], { status:data.status, minute:data.minute, hs:data.hs, as:data.as });
  } catch (e) {
    if (DETAIL.id !== id || silent) return;
    DETAIL.err = e.message;
  }
  renderDetail();
}

function sbMid(g){
  const score = `${g.hs ?? 0} - ${g.as ?? 0}`;
  if (g.status === 'final') return `<div class="score">${score}</div><div class="sub">Terminé</div>`;
  if (g.status === 'live'){
    let m = g.minute ? String(g.minute) : 'LIVE';
    if (/^\d+$/.test(m)) m += "'";
    return `<div class="score live">${score}</div><div class="sub live">${esc(m)}</div>`;
  }
  if (g.status === 'postponed') return `<div class="score muted strike">${esc(g.time||'')}</div><div class="sub">Reporté</div>`;
  return `<div class="score muted">${esc(g.time||'--:--')}</div><div class="sub">${esc(dayLabel(g.date))}</div>`;
}

function evRow(e){
  const home = e.team === 'home';
  let ic, tx;
  if (e.k === 'goal'){
    ic = '⚽';
    const extra = [e.assist ? 'Passe : ' + e.assist : '', /pen/i.test(e.info) ? 'Penalty' : (/own/i.test(e.info) ? 'Contre son camp' : '')].filter(Boolean).join(' · ');
    const line = [e.score, extra].filter(Boolean).join(' · ');
    tx = `<b>${esc(e.player)}</b>${line ? `<small>${esc(line)}</small>` : ''}`;
  } else if (e.k === 'card'){
    ic = e.card === 'red' ? '🟥' : '🟨';
    tx = `<b>${esc(e.player)}</b>`;
  } else {
    ic = '🔁';
    tx = `<b class="in">▲ ${esc(e.in)}</b><small class="out">▼ ${esc(e.out)}</small>`;
  }
  const cell = `<div class="${home?'l':'r'}">${home ? `<div class="tx">${tx}</div><span class="ic">${ic}</span>` : `<span class="ic">${ic}</span><div class="tx">${tx}</div>`}</div>`;
  return `<div class="ev">${home ? cell : '<div></div>'}<div class="min">${esc(e.time)}'</div>${home ? '<div></div>' : cell}</div>`;
}

function tabResume(d){
  const ev = [];
  d.goals.forEach(x => ev.push({ k:'goal', ...x }));
  d.cards.forEach(x => ev.push({ k:'card', ...x }));
  d.subs.forEach(x => ev.push({ k:'sub', ...x }));
  ev.sort((a,b) => minOf(a.time) - minOf(b.time));
  const showHT = d.status !== 'scheduled' && d.htHome !== '' && d.htHome != null &&
    (d.status === 'final' || minOf(d.minute) > 45 || /ht|half/i.test(d.minute || ''));
  const htRow = `<div class="sep">Mi-temps · ${esc(d.htHome)} - ${esc(d.htAway)}</div>`;
  let html = '', htDone = false;
  ev.forEach(e => {
    if (showHT && !htDone && minOf(e.time) >= 46){ html += htRow; htDone = true; }
    html += evRow(e);
  });
  if (showHT && !htDone) html += htRow;
  if (!ev.length) html = `<div class="noev">${d.status === 'scheduled' ? "Le match n'a pas encore commencé." : 'Aucun événement enregistré.'}</div>` + html;
  if (d.status === 'final') html += `<div class="sep">Fin du match · ${esc(d.hs ?? 0)} - ${esc(d.as ?? 0)}</div>`;
  const nb = (n, w) => `${n} ${w}${n > 1 ? 's' : ''}`;
  const hasLu = d.lineups.home.starters.length || d.lineups.away.starters.length;
  const avail = `Données reçues : ${nb(d.goals.length, 'but')} · ${nb(d.cards.length, 'carton')} · ${nb(d.subs.length, 'remplacement')} · compositions ${hasLu ? 'oui' : 'non'} · statistiques ${d.stats.length ? 'oui' : 'non'}`;
  return `<div class="card2">${html}</div><div class="avail">${avail}</div>`;
}

const PARTICLES = new Set(['de','da','do','dos','das','van','von','der','den','di','del','le','la','el','al','bin','ter','ten']);
function lastName(full){
  const w = String(full || '').trim().split(/\s+/);
  if (w.length <= 1) return w[0] || '';
  const prev = w[w.length - 2].toLowerCase();
  return (w.length >= 3 && PARTICLES.has(prev)) ? w[w.length - 2] + ' ' + w[w.length - 1] : w[w.length - 1];
}
const norm = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
// "Jayden Bogle" et "J. Bogle" donnent la même clé : j|bogle
const pkey = full => { const w = String(full || '').trim().split(/\s+/); return norm((w[0] || '').charAt(0)) + '|' + norm(w[w.length - 1]); };

// Répartit les 11 titulaires en lignes selon la formation (ex. 3-5-2). Renvoie null si impossible.
function formationRows(system, players){
  const parts = String(system || '').split('-').map(Number);
  if (players.length !== 11 || parts.length < 2 || parts.some(n => !n) || parts.reduce((a,b) => a + b, 0) !== 10) return null;
  const sorted = [...players].sort((a,b) => Number(a.pos) - Number(b.pos));
  if (!sorted.every((p,i) => Number(p.pos) === i + 1)) return null;
  const rows = [[sorted[0]]];
  let i = 1;
  parts.forEach(n => { rows.push(sorted.slice(i, i + n)); i += n; });
  return rows;
}

function tabCompos(d){
  const L = d.lineups;
  if (!L.home.starters.length && !L.away.starters.length)
    return `<div class="card2"><div class="noev">Pas de compositions pour ce match.<br><small style="opacity:.8">Le fournisseur de données ne les envoie pas pour toutes les compétitions, ni avant le coup d'envoi.</small></div></div>`;

  const cards = {}, out = {};
  d.cards.forEach(c => { const k = c.team + ':' + pkey(c.player); if (cards[k] !== 'red') cards[k] = c.card; });
  d.subs.forEach(x => { out[x.team + ':' + pkey(x.out)] = true; });

  const tok = (p, side) => {
    const k = side + ':' + pkey(p.name);
    const cd = cards[k] ? `<i class="cd ${cards[k] === 'red' ? 'r' : 'y'}"></i>` : '';
    const so = out[k] ? '<i class="so">↓</i>' : '';
    return `<div class="pp ${side === 'home' ? 'h' : 'a'}"><span class="pn">${esc(p.n)}${cd}${so}</span><span class="pnm">${esc(lastName(p.name))}</span></div>`;
  };
  const rowHtml = (row, side) => `<div class="prow">${row.map(p => tok(p, side)).join('')}</div>`;

  const H = formationRows(d.homeSystem, L.home.starters);
  const A = formationRows(d.awaySystem, L.away.starters);
  const pl = p => `<div class="pl"><b>${esc(p.n)}</b><span>${esc(p.name)}</span></div>`;

  // Terrain : équipe à domicile en haut, extérieur en bas
  if (H && A){
    const homeRows = H.map(r => rowHtml(r, 'home')).join('');
    const awayRows = [...A].reverse().map(r => rowHtml(r, 'away')).join('');
    const bench = (k) => {
      const l = L[k];
      return `<div class="lucol">${l.subs.length ? `<h5>Remplaçants</h5>${l.subs.map(pl).join('')}` : ''}${l.coach ? `<h5>Entraîneur</h5><div class="pl"><span>${esc(l.coach)}</span></div>` : ''}</div>`;
    };
    return `
      <div class="card2 pitchwrap">
        <div class="pl-top"><b>${esc(trTeam(d.home))}</b><span>${esc(d.homeSystem)}</span></div>
        <div class="pitch">${homeRows}<div class="half"></div>${awayRows}</div>
        <div class="pl-top"><b>${esc(trTeam(d.away))}</b><span>${esc(d.awaySystem)}</span></div>
      </div>
      <div class="legend">🟨 carton · ↓ remplacé</div>
      <div class="card2"><div class="lu">
        <div class="lucol" style="padding-bottom:0"><h4>${esc(trTeam(d.home))}</h4></div><div class="lucol" style="padding-bottom:0"><h4>${esc(trTeam(d.away))}</h4></div>
        ${bench('home')}${bench('away')}
      </div></div>`;
  }

  // Sinon : simple liste
  const col = (k, name, system) => {
    const l = L[k];
    return `<div class="lucol"><h4>${esc(name)}${system ? ` <small>${esc(system)}</small>` : ''}</h4>
      ${l.starters.map(pl).join('')}
      ${l.subs.length ? `<h5>Remplaçants</h5>${l.subs.map(pl).join('')}` : ''}
      ${l.coach ? `<h5>Entraîneur</h5><div class="pl"><span>${esc(l.coach)}</span></div>` : ''}</div>`;
  };
  return `<div class="card2"><div class="lu">${col('home', trTeam(d.home), d.homeSystem)}${col('away', trTeam(d.away), d.awaySystem)}</div></div>`;
}

function tabStats(d){
  if (!d.stats.length) return `<div class="card2"><div class="noev">Pas de statistiques pour ce match.<br><small style="opacity:.8">Le fournisseur de données ne les envoie pas pour toutes les compétitions.</small></div></div>`;
  const num = v => parseFloat(String(v).replace(',', '.')) || 0;
  const rows = d.stats.map(s => {
    const h = num(s.home), a = num(s.away), t = h + a;
    const hp = t ? (h / t) * 100 : 50;
    return `<div class="st"><div class="stl">${esc(statName(s.type))}</div>
      <div class="str"><div class="stv">${esc(s.home)}</div><div class="bar"><i class="bh" style="flex:${hp}"></i><i class="ba" style="flex:${100 - hp}"></i></div><div class="stv r">${esc(s.away)}</div></div></div>`;
  }).join('');
  return `<div class="card2">${rows}</div>`;
}

function dimTab(k){
  const d = DETAIL.data;
  if (!d) return false;
  if (k === 'compos') return !(d.lineups.home.starters.length || d.lineups.away.starters.length);
  if (k === 'stats') return !d.stats.length;
  return false;
}

function renderDetail(){
  const box = $('detail');
  if (box.hidden || !DETAIL.id) return;
  const top = box.scrollTop;
  const d = DETAIL.data, g = d || GAME_INDEX[DETAIL.id];
  const meta = [d && d.stadium, d && d.referee ? 'Arbitre : ' + d.referee : '', d && d.round ? 'Journée ' + d.round : ''].filter(Boolean).map(esc).join(' · ');
  let body;
  if (DETAIL.err && !d) body = `<div class="empty">Impossible de charger le détail.<small>${esc(DETAIL.err).slice(0,200)}</small><button class="retry" id="dretry">Réessayer</button></div>`;
  else if (!d) body = `<div class="empty">Chargement du match…<small>Le serveur gratuit peut mettre un moment à répondre.</small></div>`;
  else body = DETAIL.tab === 'resume' ? tabResume(d) : DETAIL.tab === 'compos' ? tabCompos(d) : tabStats(d);

  box.innerHTML = `
    <div class="dh">
      <button class="icon-btn" id="dback" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="ttl"><b>${esc(trComp(g.comp))}</b><small>${esc(dayLabel(g.date))}${g.time ? ' · ' + esc(g.time) : ''}</small></div>
    </div>
    <div class="sb">
      <div class="sbteam">${crest(trTeam(g.home) || '', g.homeLogo, 'big')}<span>${esc(trTeam(g.home))}</span></div>
      <div class="sbmid">${sbMid(g)}</div>
      <div class="sbteam">${crest(trTeam(g.away) || '', g.awayLogo, 'big')}<span>${esc(trTeam(g.away))}</span></div>
    </div>
    ${meta ? `<div class="meta">${meta}</div>` : ''}
    <div class="dtabs">${[['resume','Résumé'],['compos','Compos'],['stats','Stats']].map(([k,l]) => `<button class="dtab ${DETAIL.tab===k?'active':''} ${dimTab(k)?'dim':''}" data-t="${k}">${l}</button>`).join('')}</div>
    ${body}`;

  $('dback').onclick = backFromDetail;
  box.querySelectorAll('.dtab').forEach(b => b.onclick = () => { DETAIL.tab = b.dataset.t; renderDetail(); });
  const r = $('dretry');
  if (r) r.onclick = () => { DETAIL.err = null; renderDetail(); loadDetail(); };
  box.scrollTop = top;
}


/* ---------- panneaux : réglages et compte ---------- */
const PANEL = { kind:null, msg:false };
function openPanel(kind){
  closeDrawer();
  PANEL.kind = kind; PANEL.msg = false;
  const box = $('panel');
  box.hidden = false; box.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  history.pushState({ p:1 }, '');
  renderPanel();
}
function hidePanel(){
  $('panel').hidden = true;
  PANEL.kind = null;
  document.body.style.overflow = ($('detail').hidden ? '' : 'hidden');
}
function backFromPanel(){ if (history.state && history.state.p) history.back(); else hidePanel(); }

function updateAccIcon(){
  $('accBtn').innerHTML = PROFILE.name
    ? `<span class="avatar">${esc(PROFILE.name.trim().charAt(0).toUpperCase())}</span>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.7-3.6 3.5-5.6 7.2-5.6s6.5 2 7.2 5.6"/></svg>`;
}

function refreshAfterSetting(){
  refreshList();
  if (!$('detail').hidden) renderDetail();
  renderLeagueList(); renderFilterBar();
}

function renderPanel(){
  const box = $('panel');
  if (box.hidden || !PANEL.kind) return;
  const top = box.scrollTop;
  const head = t => `<div class="dh"><button class="icon-btn" id="pback" aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div class="ttl"><b>${t}</b></div></div>`;
  let html;
  if (PANEL.kind === 'settings'){
    const seg = [['small','Petit'],['normal','Normal'],['large','Grand']].map(([v,l]) => `<button data-v="${v}" class="${SETTINGS.size===v?'on':''}">${l}</button>`).join('');
    html = head('Réglages') + `
      <div class="card2 set" style="margin-top:16px">
        <div class="row"><div class="rl"><b>Taille du texte</b><small>« Normal » est le réglage recommandé</small></div><div class="seg" id="segSize">${seg}</div></div>
        <div class="row"><div class="rl"><b>Noms en français</b><small>Pays, sélections et compétitions</small></div><label class="sw"><input type="checkbox" id="setFr" ${SETTINGS.fr ? 'checked' : ''}><i></i></label></div>
        <div class="row"><div class="rl"><b>Actualisation automatique</b><small>Met à jour les matchs en direct toutes les 90 secondes</small></div><label class="sw"><input type="checkbox" id="setAuto" ${SETTINGS.auto ? 'checked' : ''}><i></i></label></div>
      </div>
      <div class="card2 set">
        <div class="row tap" id="goAccount"><div class="rl"><b>Mon compte</b><small>Facultatif · pour retrouver tes favoris sur tous tes appareils</small></div><span class="chev">›</span></div>
      </div>
      <div class="card2 set">
        <div class="row"><div class="rl"><b>À propos</b><small>Coup d'Envoi · ${VERSION}</small></div></div>
      </div>`;
  } else {
    const n = PROFILE.name.trim();
    html = head('Mon compte') + `
      <div class="acc">
        <div class="avatar big ${n ? 'has' : ''}">${n ? esc(n.charAt(0).toUpperCase()) : '👤'}</div>
        <h3>${n ? 'Salut ' + esc(n) + ' 👋' : "Tu utilises l'app sans compte"}</h3>
        <p>Un compte est <b>facultatif</b> : il servira à retrouver tes favoris et tes réglages sur tous tes appareils. Tout le reste fonctionne très bien sans compte.</p>
        <button class="btn primary" id="accLogin">Se connecter <span class="soon-tag">Bientôt</span></button>
        <button class="btn" id="accSignup">Créer un compte <span class="soon-tag">Bientôt</span></button>
        ${PANEL.msg ? `<div class="note">La connexion arrive bientôt. En attendant, tu peux choisir un pseudo ci-dessous : il reste enregistré sur cet appareil.</div>` : ''}
      </div>
      <div class="card2 set">
        <div class="row col"><div class="rl"><b>Ton pseudo</b><small>Enregistré uniquement sur cet appareil</small></div>
          <div class="nm"><input id="accName" value="${esc(PROFILE.name)}" maxlength="20" placeholder="Ex : Moussa"><button class="btn small" id="accSave">Enregistrer</button></div></div>
      </div>
      <div class="card2 set"><div class="row tap" id="goSettings"><div class="rl"><b>Réglages</b><small>Taille du texte, langue, actualisation</small></div><span class="chev">›</span></div></div>`;
  }
  box.innerHTML = html;
  $('pback').onclick = backFromPanel;
  const on = (id, fn) => { const e = $(id); if (e) e.onclick = fn; };

  if (PANEL.kind === 'settings'){
    box.querySelectorAll('#segSize button').forEach(b => b.onclick = () => { SETTINGS.size = b.dataset.v; saveSettings(); applySize(); renderPanel(); });
    $('setFr').onchange = e => { SETTINGS.fr = e.target.checked; saveSettings(); refreshAfterSetting(); };
    $('setAuto').onchange = e => { SETTINGS.auto = e.target.checked; saveSettings(); };
    on('goAccount', () => { PANEL.kind = 'account'; PANEL.msg = false; renderPanel(); });
  } else {
    on('accLogin', () => { PANEL.msg = true; renderPanel(); });
    on('accSignup', () => { PANEL.msg = true; renderPanel(); });
    on('accSave', () => { PROFILE.name = $('accName').value.trim(); saveProfile(); updateAccIcon(); renderPanel(); });
    on('goSettings', () => { PANEL.kind = 'settings'; renderPanel(); });
  }
  box.scrollTop = top;
}
$('accBtn').onclick = () => openPanel('account');
$('dSettings').onclick = () => openPanel('settings');
$('dAccount').onclick = () => openPanel('account');
updateAccIcon();

renderLeagueList();
renderDates();
show();
</script>
</body>
</html>
