  pushPanelState();
  history.pushState({ p:1 }, '');
  PANEL.kind = kind; Object.assign(PANEL, patch || {});
  $('panel').scrollTop = 0;
  renderPanel();
  slideIn('fwd');
}
function restorePanel(){
  const snap = PSTACK.pop(); if (!snap) return;
  Object.keys(PANEL).forEach(k => { delete PANEL[k]; });
  Object.assign(PANEL, snap);
  renderPanel();
  $('panel').scrollTop = snap._st || 0;
  slideIn('back');
}
function hidePanel(){
  PSTACK.length = 0;
  $('panel').hidden = true;
  PANEL.kind = null;
  document.body.style.overflow = ($('detail').hidden ? '' : 'hidden');
}

/* recherche de clubs et joueurs (index côté serveur) */
const SRCH = { t:null, res:null, q:'', seq:0, list:[] };
function scheduleSearch(){
  clearTimeout(SRCH.t);
  const q = COMP.q.trim();
  if (q.length < 2){ SRCH.res = null; renderSearchRes(); return; }
  SRCH.t = setTimeout(async () => {
    const my = ++SRCH.seq;
    try {
      const { data } = await apiGet(`${BACKEND}/api/search?q=${encodeURIComponent(q)}`);
      if (my !== SRCH.seq) return;
      SRCH.res = data; SRCH.q = q;
    } catch (e) { SRCH.res = null; }
    renderSearchRes();
  }, 350);
}
function renderSearchRes(){
  const box = $('exsres');
  if (!box) return;
  const r = SRCH.res;
  if (!r || COMP.q.trim().length < 2){ box.innerHTML = ''; return; }
  SRCH.list = r.players;
  const img = (u, cls) => u ? `<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=sph></span>'">` : '<span class="sph"></span>';
  let h = '';
  if (r.teams.length) h += `<div class="shead">Clubs et équipes</div><section class="group">` + r.teams.map(t =>

function loadTopPhotos(c, rows){

  const again = () => { if (!$('panel').hidden && PANEL.kind === 'competition' && PANEL.comp && PANEL.comp.id === c.id) renderPanel(); };
  // 1) effectifs des équipes concernées
  const ids = [...new Set(rows.filter(r => r.teamId).map(r => r.teamId))].slice(0, 16);
  const todo = ids.filter(id => !TEAM[teamKey(c.id, id)] && !TEAM[teamKey(c.id, id) + ':tried']);
  if (todo.length){
    T.phBusy = true;
    let i = 0;
    const worker = async () => {
      while (i < todo.length){
        const id = todo[i++];
        try { await getTeam(c.id, id); } catch (e) { TEAM[teamKey(c.id, id) + ':tried'] = 1; }
      }

    Promise.all([worker(), worker(), worker()]).then(() => { T.phBusy = false; again(); });
    return;
  }

  const need = rows.filter(r => r.team && !topPhoto(c, r) && !PH[phKey(r.team, r.name) + '#miss']);
  if (!need.length) return;
  T.phBusy = true; T.phTries = (T.phTries || 0) + 1;
  const byTeam = {};

        const res = await fetch(`${BACKEND}/api/photos?team=${encodeURIComponent(team)}&names=${encodeURIComponent(names.join('|'))}`);

async function loadFavGames(){
  if (FAVSTATE.loading) return;
  FAVSTATE.loading = true; FAVSTATE.err = null; FAVSTATE.dirty = false; FAVSTATE.failed = 0;
  renderFavoris();
  const from = addDays(TODAY, -7), to = addDays(TODAY, 14);
  const map = {};
  FAV.matches.forEach(m => { localize(m); map[m.id] = { ...m }; if (!GAME_INDEX[m.id]) GAME_INDEX[m.id] = map[m.id]; });

  const teams = FAV.teams.slice(0, 15);
  const results = await Promise.allSettled(teams.map(async t => {
    const { data, stale } = await apiGet(`${BACKEND}/api/fixtures?team_id=${encodeURIComponent(t.id)}&from=${from}&to=${to}`);
    return data.games || [];
  }));
  let firstErr = '';
  results.forEach(r => {
    if (r.status === 'fulfilled') r.value.forEach(g => { localize(g); map[g.id] = g; GAME_INDEX[g.id] = g; });
    else { FAVSTATE.failed++; firstErr = firstErr || (r.reason && r.reason.message) || 'Erreur'; }
  });

  // mettre à jour le score et le statut des matchs suivis
  const days = [...new Set(FAV.matches.map(m => m.date))].filter(d => d >= from && d <= to).slice(0, 4);
  await Promise.allSettled(days.map(async d => {
    const list = await getDay(d);
    list.forEach(g => {
      if (!isFavMatch(g.id)) return;
      map[g.id] = g; GAME_INDEX[g.id] = g;
      const i = FAV.matches.findIndex(m => m.id === String(g.id));
      if (i >= 0) FAV.matches[i] = snap(g);
    });
  }));
  try { localStorage.setItem('ce_favs', JSON.stringify(FAV)); } catch(e) {}

  FAVSTATE.games = Object.values(map);
  FAVSTATE.err = (teams.length && FAVSTATE.failed === teams.length && !FAV.matches.length) ? firstErr : null;
  FAVSTATE.ts = Date.now(); FAVSTATE.loading = false;
  renderFavoris();
}

function showFavoris(){
  if (state.page !== 'favoris') return;
  if (!FAV.teams.length && !FAV.matches.length){ FAVSTATE.games = []; FAVSTATE.dirty = false; renderFavoris(); return; }
  if (FAVSTATE.dirty || !FAVSTATE.games || Date.now() - FAVSTATE.ts > 60000) loadFavGames(); else renderFavoris();
}

  const m = Math.max(0, Math.round((ts - Date.now()) / 60000));
  if (m >= 1440) return `Dans ${Math.floor(m / 1440)} j ${Math.floor(m % 1440 / 60)} h`;
  if (m >= 60) return `Dans ${Math.floor(m / 60)} h ${m % 60} min`;
  return `Dans ${m} min`;
}

function icsDownload(games, name){
  const pad = n => String(n).padStart(2, '0'), fmt = t => { const d = new Date(t); return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + '00Z'; };
  const esc2 = t => String(t || '').replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, ' ');
  const ev = games.filter(g => typeof g.ts === 'number').map(g => ['BEGIN:VEVENT', `UID:${g.id}@coup-denvoi`, `DTSTAMP:${fmt(Date.now())}`, `DTSTART:${fmt(g.ts)}`, `DTEND:${fmt(g.ts + 2 * 3600000)}`, `SUMMARY:${esc2(g.home + ' - ' + g.away)}`, `DESCRIPTION:${esc2(g.comp || '')}`, 'END:VEVENT'].join('\r\n'));
  if (!ev.length){ toastMsg('Aucun match à ajouter.'); return; }
  const txt = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Coup Denvoi//FR', ...ev, 'END:VCALENDAR'].join('\r\n');
  const url = URL.createObjectURL(new Blob([txt], { type:'text/calendar' }));
  const a = document.createElement('a'); a.href = url; a.download = (name || 'match') + '.ics'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function favTodayHtml(){
  const seen = new Set(), list = (FAVSTATE.games || []).filter(g => g.date === TODAY && !seen.has(g.id) && seen.add(g.id)).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  if (list.length < 1) return '';
  const cards = list.map(g => {
    const live = g.status === 'live', fin = g.status === 'final';
    const sc = (live || fin) ? (scoreHidden(g) ? '• - •' : `${g.hs ?? 0} - ${g.as ?? 0}`) : '';
    const tag = live ? 'En direct' : fin ? 'Terminé' : (g.time || '');
    return `<div class="fnx" data-mid="${esc(g.id)}"><div class="tg ${live ? 'lv' : ''}">${esc(tag)}</div><div class="op">${crest(trTeam(g.home) || '', g.homeLogo, 'xs')}<span>${esc(trTeam(g.home))}</span></div><div class="op">${crest(trTeam(g.away) || '', g.awayLogo, 'xs')}<span>${esc(trTeam(g.away))}</span>${sc ? `<b>${sc}</b>` : ''}</div></div>`;
  }).join('');
  const fin = list.filter(g => g.status === 'final');
  let pts = 0, np = 0;
  Object.entries(PRON.preds).forEach(([id, p]) => { const r = PRON.res[id]; if (p.date === TODAY && r){ pts += pronPts(p, r); np++; } });
  const sum = fin.length && fin.length === list.length ? `<div class="card2 daysum"><b>Résumé du jour</b><span>${fin.length} match${fin.length > 1 ? 's' : ''} terminé${fin.length > 1 ? 's' : ''}${np ? ` · ${pts} point${pts > 1 ? 's' : ''} aux pronostics` : ''}</span></div>` : '';
  return `<h3 class="ftitle">Aujourd'hui</h3><div class="fnx-row">${cards}</div>${sum}`;
}
function renderFavoris(){
  if (state.page !== 'favoris') return;
  const main = $('main');
  if (!FAV.teams.length && !FAV.matches.length && !FAV.players.length){
    main.innerHTML = pronEntryHtml() + `<div class="empty">Tu n'as pas encore de favoris.<small>Ouvre un match, puis touche ☆ pour le suivre, ou « ☆ Suivre » sous une équipe pour voir ici ses prochains matchs et ses résultats.</small></div>`;
    return;
  }
  let html = pronEntryHtml();
  if (FAV.teams.length && FAVSTATE.games && !FAVSTATE.err) html += favHeroHtml();
  if (FAVSTATE.games && !FAVSTATE.err) html += favTodayHtml();
  if (FAV.teams.length){
    html += `<h3 class="ftitle">Mes équipes</h3><div class="chips">` + FAV.teams.map(t =>
      `<span class="fchip"><span class="fchip-tap" data-id="${esc(t.id)}" data-lid="${esc(t.leagueId||'')}" data-name="${esc(t.name)}" data-logo="${esc(t.logo||'')}">${crest(trTeam(t.name) || '', t.logo, 'sm')}<b>${esc(trTeam(t.name))}</b></span><i class="fm" data-main="${esc(t.id)}" aria-label="Équipe principale">${mainTeam() && mainTeam().id === t.id ? '★' : '☆'}</i><i class="fx" data-rm="${esc(t.id)}" aria-label="Retirer">✕</i></span>`).join('') + `</div>`;
  }
  if (FAV.players.length){
    html += `<h3 class="ftitle">Mes joueurs</h3><div class="chips">` + FAV.players.map(p =>
      `<span class="fchip"><span class="fchip-tap" data-pk="${esc(p.key)}">${pfacePlayer({ name:p.name, photo:p.photo }, 'sm')}<b>${esc(trTeam(p.name))}</b></span><i class="fx" data-rmp="${esc(p.key)}">✕</i></span>`).join('') + `</div>`;
  }
  if (FAV.teams.length && FAVSTATE.games && !FAVSTATE.err) html += favNextHtml();
  if (FAVSTATE.loading || !FAVSTATE.games){
    html += `<div class="empty">Chargement de tes favoris…<small>Le serveur gratuit peut mettre un moment à répondre.</small></div>`;
  } else if (FAVSTATE.err){
    html += `<div class="empty">Impossible de charger tes favoris.<small>${esc(FAVSTATE.err).slice(0,200)}</small><button class="retry" id="fretry">Réessayer</button></div>`;
  } else {
    const key = g => (g.date || '') + ' ' + (g.time || '');
    const up = FAVSTATE.games.filter(g => g.status !== 'final').sort((a,b) => key(a).localeCompare(key(b)));
    const past = FAVSTATE.games.filter(g => g.status === 'final').sort((a,b) => key(b).localeCompare(key(a)));
    const block = (title, list, desc) => {
      if (!list.length) return '';
      const by = {};
      list.forEach(g => (by[g.date] = by[g.date] || []).push(g));
      const dates = Object.keys(by).sort();
      if (desc) dates.reverse();
      return `<h3 class="ftitle">${title}</h3>` + dates.map(d => `<section class="group"><div class="lg"><span class="lgn">${esc(dayLabel(d))}</span></div>${
        by[d].sort((a,b) => desc ? (b.time || '').localeCompare(a.time || '') : (a.time || '').localeCompare(b.time || '')).map(matchRow).join('')}</section>`).join('');
    };
    html += block('À venir et en direct', up, false) + block('Résultats récents', past, true);
    if (!up.length && !past.length) html += `<div class="empty">Aucun match trouvé pour tes favoris entre le ${esc(dayLabel(addDays(TODAY, -7)))} et le ${esc(dayLabel(addDays(TODAY, 14)))}.</div>`;
    if (FAVSTATE.failed) html += `<div class="avail">${FAVSTATE.failed} équipe${FAVSTATE.failed > 1 ? 's' : ''} n'${FAVSTATE.failed > 1 ? 'ont' : 'a'} pas pu être chargée${FAVSTATE.failed > 1 ? 's' : ''}. Rouvre la page pour réessayer.</div>`;
  }
  const fsig = html + I18N.lang;
  if (main.dataset.fsig !== fsig || !main.querySelector('#goPron')){ main.innerHTML = html + `<div class="ver">Coup d'Envoi · ${VERSION}</div>`; main.dataset.fsig = fsig; }
  const r = $('fretry');
  if (r) r.onclick = () => { FAVSTATE.dirty = true; showFavoris(); };
}
$('main').addEventListener('click', e => {
  const op = e.target.closest('.fh-open');
  if (op){ openTeam(op.dataset.id, op.dataset.lid, op.dataset.name, op.dataset.logo || null); return; }
  const fm = e.target.closest('.fh-mid, .fh-last');
  if (fm){ openMatch(fm.dataset.mid); return; }
  const mn = e.target.closest('[data-main]');
  if (mn){ FAV.main = mn.dataset.main; saveFav(); FAVSTATE.dirty = false; renderFavoris(); applyTeamTheme(); return; }
  const nx = e.target.closest('.fnx');
  if (nx){ openMatch(nx.dataset.mid); return; }
  const pk = e.target.closest('[data-pk]');
  if (pk){
    const p = FAV.players.find(x => x.key === pk.dataset.pk); if (!p) return;
    prePanel();
    const found = p.teamId && p.leagueId ? findSquadPlayer(p.leagueId, p.teamId, p.name) : null;
    PANEL.team = { id:p.teamId, leagueId:p.leagueId, name:p.team, logo:p.logo };
    PANEL.squad = null; PANEL.teamErr = null; PANEL.sub = 'player';
    PANEL.player = found || { id:pkey(p.name), name:p.name, fullName:p.fullName, number:p.number, age:null, birthdate:null, country:null, position:p.position, photo:p.photo, captain:false, injured:false, stats:{} };
    openPanel('team'); if (p.teamId && p.leagueId) loadSquad();
    return;
  }
  const rp = e.target.closest('[data-rmp]');
  if (rp){ FAV.players = FAV.players.filter(x => x.key !== rp.dataset.rmp); saveFav(); FAVSTATE.dirty = false; renderFavoris(); return; }
  const tap = e.target.closest('.fchip-tap');
  if (tap) { openTeam(tap.dataset.id, tap.dataset.lid, tap.dataset.name, tap.dataset.logo || null); return; }
  const x = e.target.closest('[data-rm]');
  if (!x) return;
  toggleFavTeam(x.dataset.rm);
  FAVSTATE.dirty = false;
  if (FAVSTATE.games) FAVSTATE.games = FAVSTATE.games.filter(isFavGame);
  renderFavoris();
});
